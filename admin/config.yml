backend:
  name: git-gateway
  repo: premicist/Learn
  branch: main
  identity_url: https://auth.decapbridge.com/sites/afb8cc14-b7e5-4678-9382-d3136ac237a9
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://prempokhrel.com.np
media_folder: public/images/uploads
public_folder: /images/uploads
collections:
  - name: subjects
    label: Subjects & Levels
    files:
      - file: content/subjects.yml
        label: Subjects & Levels
        name: subjects
        fields:
          - label: Levels
            name: levels
            widget: list
            fields:
              - { label: 'ID (lowercase kebab-case, e.g. bachelors)', name: id, widget: string }
              - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
              - { label: 'Short title (for menus)', name: shortTitle, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Subjects
            name: subjects
            widget: list
            fields:
              - { label: 'ID (lowercase kebab-case, e.g. microeconomics)', name: id, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers, and hyphens only.'] }
              - label: Level
                name: levelId
                widget: relation
                collection: subjects
                file: subjects
                search_fields: [levels.*.id, levels.*.title]
                display_fields: [levels.*.title, levels.*.id]
                value_field: levels.*.id
              - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
              - { label: Description, name: description, widget: text }
              - { label: Color (hex code), name: color, widget: color, allowInput: true }
              - label: Featured resources
                name: featured
                widget: list
                required: false
                summary: '{{type}}: {{id}}'
                hint: 'Add resources in the order they should appear. Use the exact Markdown filename without .md.'
                fields:
                  - { label: Type, name: type, widget: select, options: [note, blog, quiz, video] }
                  - { label: Resource, name: id, widget: resource_id, hint: 'Search by title, subject, or resource ID. Choose the resource matching the selected type.' }

  - name: curricula
    label: Guided Curricula
    files:
      - file: content/curriculum.yml
        label: Guided Curricula
        name: curriculum
        fields:
          - label: Curricula
            name: curricula
            widget: list
            fields:
              - { label: 'ID (lowercase kebab-case)', name: id, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers, and hyphens only.'] }
              - label: Subject
                name: subjectId
                widget: relation
                collection: subjects
                file: subjects
                search_fields: [subjects.*.id, subjects.*.title]
                display_fields: [subjects.*.title, subjects.*.id]
                value_field: subjects.*.id
              - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
              - { label: Description, name: description, widget: text }
              - { label: Syllabus note, name: syllabusNote, widget: string, hint: 'Use simple wording such as Based on the latest NEB syllabus.' }
              - label: Units
                name: units
                widget: list
                fields:
                  - { label: 'Unit ID', name: id, widget: string }
                  - { label: Order, name: order, widget: number, value_type: int }
                  - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
                  - { label: Summary, name: summary, widget: text }
                  - { label: 'Estimated minutes', name: estimatedMinutes, widget: number, value_type: int }
                  - { label: Outcomes, name: outcomes, widget: list }
                  - label: Lessons
                    name: lessons
                    widget: list
                    fields:
                      - { label: 'Lesson ID', name: id, widget: string }
                      - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
                      - { label: Resource type, name: resourceType, widget: select, options: [note, blog, quiz, video] }
                      - { label: Resource, name: resourceId, widget: resource_id, hint: 'Search for the note, blog, quiz, or video to place in this lesson.' }
                      - { label: 'Estimated minutes', name: estimatedMinutes, widget: number, value_type: int }
                      - { label: Description, name: description, widget: text }

  - name: notes
    label: Notes
    folder: content/notes
    create: true
    summary: '{{title}} · {{subjectId}}'
    slug: '{{slug}}'
    fields:
      - label: Subject
        name: subjectId
        widget: relation
        collection: subjects
        file: subjects
        search_fields: [subjects.*.id, subjects.*.title]
        display_fields: [subjects.*.title, subjects.*.id]
        value_field: subjects.*.id
        hint: 'Search by subject title; the CMS stores the matching subject ID.'
      - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
      - { label: Summary, name: summary, widget: text, hint: 'Write 1–2 sentences describing what a learner will understand or do.' }
      - { label: Date, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { label: Cover Image, name: image, widget: image, required: false }
      - { label: Image alt text, name: imageAlt, widget: string, required: false, hint: 'Describe the image when it conveys meaning; leave blank for decorative images.' }
      - { label: Enable slide viewer, name: slidesEnabled, widget: boolean, required: false, default: false, hint: 'Show a note-derived slide viewer at the top of this note.' }
      - label: Slide controls
        name: slideControls
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Slide mode, name: mode, widget: select, options: [auto, text, bullets, recap], default: auto, hint: 'Use text for paragraph-heavy notes, bullets for compact points, or recap for a summary-focused deck.' }
          - { label: Maximum points per slide, name: maxPoints, widget: number, value_type: int, min: 1, max: 6, default: 4, hint: 'Lower this for dense or numerical notes.' }
          - { label: Include quick check, name: includeQuickCheck, widget: boolean, default: true }
          - { label: Sections to include, name: sections, widget: list, required: false, hint: 'Optional exact H2 section titles. Leave empty to include all sections.' }
          - { label: Deck title, name: title, widget: string, required: false, hint: 'Optional custom title for the slide viewer.' }
      - label: Structured visual blocks
        name: visualBlocks
        widget: list
        required: false
        collapsed: true
        hint: 'Use explicit data for formulas, tables, and graphs. Generated graphs must be checked before publishing.'
        types:
          - label: Formula
            name: formula
            widget: object
            fields:
              - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
              - { label: Expression, name: expression, widget: string, hint: 'Use LaTeX math, for example: \\frac{WF}{N}. Inline: \\(W = \\frac{WF}{N}\\).' }
              - { label: Explanation, name: explanation, widget: text, required: false }
          - label: Table
            name: table
            widget: object
            fields:
              - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
              - { label: Columns, name: columns, widget: list }
              - label: Rows
                name: rows
                widget: list
                hint: 'Add one row at a time. Each row must contain one cell for every column.'
                fields:
                  - { label: Cells, name: cells, widget: list, hint: 'Enter cells in the same order as Columns.' }
          - label: Graph
            name: graph
            widget: object
            fields:
              - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
              - { label: Generated SVG asset, name: asset, widget: string, hint: 'Use a generated /generated/visuals/*.svg path.' }
              - { label: X-axis label, name: xLabel, widget: string }
              - { label: Y-axis label, name: yLabel, widget: string }
              - label: Points
                name: points
                widget: list
                hint: 'Add one point at a time using the same x and y values as the source table.'
                fields:
                  - { label: X value, name: x, widget: number, value_type: float }
                  - { label: Y value, name: y, widget: number, value_type: float }
      - { label: Body, name: body, widget: markdown }

  - name: blogs
    label: Blog Posts
    folder: content/blogs
    create: true
    summary: '{{title}} · {{subjectId}}'
    slug: '{{slug}}'
    fields:
      - label: Subject
        name: subjectId
        widget: relation
        collection: subjects
        file: subjects
        search_fields: [subjects.*.id, subjects.*.title]
        display_fields: [subjects.*.title, subjects.*.id]
        value_field: subjects.*.id
        hint: 'Search by subject title; the CMS stores the matching subject ID.'
      - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
      - { label: Date, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Cover Image, name: image, widget: image, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: quizzes
    label: Quizzes
    folder: content/quizzes
    create: true
    summary: '{{title}} · {{subjectId}}'
    slug: '{{slug}}'
    fields:
      - label: Subject
        name: subjectId
        widget: relation
        collection: subjects
        file: subjects
        search_fields: [subjects.*.id, subjects.*.title]
        display_fields: [subjects.*.title, subjects.*.id]
        value_field: subjects.*.id
        hint: 'Search by subject title; the CMS stores the matching subject ID.'
      - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
      - label: Questions
        name: questions
        widget: list
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Options, name: options, widget: list }
          - { label: 'Correct option number (0 = first option, 1 = second, etc.)', name: answerIndex, widget: number, value_type: int }
          - { label: Explanation, name: explanation, widget: text }

  - name: videos
    label: Videos
    folder: content/videos
    create: true
    summary: '{{title}} · {{subjectId}}'
    slug: '{{slug}}'
    fields:
      - label: Subject
        name: subjectId
        widget: relation
        collection: subjects
        file: subjects
        search_fields: [subjects.*.id, subjects.*.title]
        display_fields: [subjects.*.title, subjects.*.id]
        value_field: subjects.*.id
        hint: 'Search by subject title; the CMS stores the matching subject ID.'
      - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
      - { label: 'YouTube video ID', name: youtubeId, widget: string, required: false, pattern: ['^[A-Za-z0-9_-]{6,}$', 'Enter only the YouTube video ID, not the full URL.'], hint: 'From youtube.com/watch?v=THIS_PART' }
      - { label: Description, name: description, widget: text }
      - { label: Transcript, name: transcript, widget: text, required: false }
      - label: Key takeaways
        name: keyTakeaways
        widget: list
        required: false
