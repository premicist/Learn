<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Content Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <link rel="stylesheet" href="/admin/guided-widgets.css" />
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script src="/admin/guided-widgets.js"></script>
    <script>
      (function () {
        var h = window.h;
        var createClass = window.createClass;
        var catalogPromise = fetch('/admin/resource-catalog.json').then(function (response) {
          if (!response.ok) throw new Error('Resource catalog unavailable');
          return response.json();
        }).catch(function () { return []; });

        function value(entry, field, fallback) {
          if (!entry || !entry.getIn) return fallback || '';
          var result = entry.getIn(['data', field]);
          if (result === undefined || result === null) result = entry.getIn([field]);
          if (result === undefined || result === null) return fallback || '';
          return result && result.toJS ? result.toJS() : result;
        }

        function escapeText(text) {
          return String(text || '').replace(/\s+/g, ' ').trim();
        }

        function inlineText(text) {
          return escapeText(text)
            .replace(/\*\*(.+?)\*\*/g, '$1')
            .replace(/\*(.+?)\*/g, '$1')
            .replace(/`(.+?)`/g, '$1');
        }

        function parseInlineBlock(block) {
          var match = String(block || '').match(/^```learn-(formula|table|graph|resource)\n([\s\S]*?)\n```$/);
          if (!match) return null;
          try {
            return { type: match[1], data: JSON.parse(match[2]) || {} };
          } catch (error) {
            return { type: match[1], data: { title: 'Invalid inline block', error: 'The saved block data could not be read.' } };
          }
        }

        function inlineBlockPreview(block, index) {
          var data = block.data || {};
          var title = data.title || data.label || data.resourceId || block.type;
          var detail = block.type === 'formula'
            ? (data.expression || 'Formula')
            : block.type === 'table'
              ? ((data.columns || []).join(' · ') || 'Table')
              : block.type === 'graph'
                ? ((data.xLabel || 'x') + ' against ' + (data.yLabel || 'y'))
                : ((data.resourceType || 'resource') + ' · ' + (data.resourceId || 'Choose a resource'));
          return h('aside', { className: 'learn-preview-inline-block', key: index }, [
            h('span', { className: 'learn-preview-kicker' }, block.type.charAt(0).toUpperCase() + block.type.slice(1)),
            h('strong', null, title),
            h('p', null, detail),
          ]);
        }

        function bodyBlocks(body) {
          return String(body || '')
            .split(/\n\s*\n/)
            .map(function (block) { return block.trim(); })
            .filter(Boolean)
            .slice(0, 18)
            .map(function (block, index) {
              var lines = block.split('\n');
              var first = lines[0] || '';
              var inlineBlock = parseInlineBlock(block);
              if (inlineBlock) return inlineBlockPreview(inlineBlock, index);
              if (/^###\s+/.test(first)) return h('h3', { key: index }, inlineText(first.replace(/^###\s+/, '')));
              if (/^##\s+/.test(first)) return h('h2', { key: index }, inlineText(first.replace(/^##\s+/, '')));
              if (/^#\s+/.test(first)) return h('h2', { key: index }, inlineText(first.replace(/^#\s+/, '')));
              if (lines.every(function (line) { return /^[-*]\s+/.test(line); })) {
                return h('ul', { key: index }, lines.map(function (line, itemIndex) {
                  return h('li', { key: itemIndex }, inlineText(line.replace(/^[-*]\s+/, '')));
                }));
              }
              if (/^>\s+/.test(first)) return h('blockquote', { key: index }, inlineText(lines.join(' ')).replace(/^>\s+/, ''));
              return h('p', { key: index }, inlineText(lines.join(' ')));
            });
        }

        function visualSummary(blocks) {
          return (Array.isArray(blocks) ? blocks : []).map(function (block, index) {
            var type = block.type || 'visual';
            var title = block.title || type;
            var detail = '';
            if (type === 'formula') detail = block.expression || 'Formula expression not entered yet.';
            if (type === 'table') detail = (block.columns || []).join(' · ') || 'Table columns not entered yet.';
            if (type === 'graph') detail = (block.xLabel || 'x') + ' against ' + (block.yLabel || 'y');
            return h('div', { className: 'learn-preview-visual', key: index }, [
              h('span', { className: 'learn-preview-kicker' }, type),
              h('strong', null, title),
              h('p', null, detail),
            ]);
          });
        }

        var ResourceControl = createClass({
          getInitialState: function () { return { catalog: [], query: '', open: false }; },
          componentDidMount: function () {
            var self = this;
            catalogPromise.then(function (catalog) {
              self.setState({ catalog: catalog });
            });
          },
          selectResource: function (resource) {
            this.props.onChange(resource.id);
            this.setState({ query: resource.title, open: false });
          },
          render: function () {
            var self = this;
            var current = String(this.props.value || '');
            var query = this.state.query || current;
            var normalized = query.toLowerCase();
            var matches = this.state.catalog.filter(function (resource) {
              return [resource.title, resource.id, resource.subjectId, resource.type].join(' ').toLowerCase().indexOf(normalized) >= 0;
            }).slice(0, 8);
            return h('div', { className: 'learn-resource-picker' }, [
              h('input', {
                id: this.props.forID,
                type: 'search',
                value: query,
                placeholder: 'Search title, subject, or ID…',
                onFocus: function () { self.setState({ open: true }); },
                onChange: function (event) { self.setState({ query: event.target.value, open: true }); },
              }),
              this.state.open && normalized
                ? h('div', { className: 'learn-resource-results' }, matches.length
                  ? matches.map(function (resource) {
                      return h('button', {
                        type: 'button',
                        className: 'learn-resource-result',
                        key: resource.type + '/' + resource.id,
                        onMouseDown: function (event) { event.preventDefault(); self.selectResource(resource); },
                      }, [
                        h('strong', null, resource.title),
                        h('span', null, resource.type + ' · ' + (resource.subjectId || 'No subject')),
                      ]);
                    })
                  : h('div', { className: 'learn-resource-empty' }, 'No matching resource found.'))
                : null,
              current && query !== current ? h('small', null, 'Stored resource ID: ' + current) : null,
            ]);
          },
        });

        var ResourcePreview = createClass({
          render: function () {
            var resourceId = String(this.props.value || '');
            return h('span', null, resourceId || 'No resource selected');
          },
        });

        function parseEditorBlock(match) {
          try { return JSON.parse(match[1]) || {}; } catch (error) { return {}; }
        }

        function inlineBlockMarkdown(type, data) {
          return '\n\n```learn-' + type + '\n' + JSON.stringify(data || {}) + '\n```\n\n';
        }

        function registerInlineEditorComponents() {
          var visualField = function (name, label, widget) {
            return { name: name, label: label, widget: widget };
          };
          CMS.registerEditorComponent({
            id: 'learn-formula',
            label: 'Formula',
            fields: [visualField('formula', 'Formula', 'formula_builder')],
            pattern: /^```learn-formula\n([\s\S]*?)\n```$/m,
            fromBlock: function (match) { return { formula: parseEditorBlock(match) }; },
            toBlock: function (data) { return inlineBlockMarkdown('formula', data.formula); },
            toPreview: function (data) { return '<strong>Formula</strong><br>' + String((data.formula || {}).expression || 'Formula'); },
          });
          CMS.registerEditorComponent({
            id: 'learn-table',
            label: 'Table',
            fields: [visualField('table', 'Table', 'table_builder')],
            pattern: /^```learn-table\n([\s\S]*?)\n```$/m,
            fromBlock: function (match) { return { table: parseEditorBlock(match) }; },
            toBlock: function (data) { return inlineBlockMarkdown('table', data.table); },
            toPreview: function (data) { return '<strong>Table</strong><br>' + String((data.table || {}).title || 'Table'); },
          });
          CMS.registerEditorComponent({
            id: 'learn-graph',
            label: 'Graph',
            fields: [visualField('graph', 'Graph', 'graph_builder')],
            pattern: /^```learn-graph\n([\s\S]*?)\n```$/m,
            fromBlock: function (match) { return { graph: parseEditorBlock(match) }; },
            toBlock: function (data) { return inlineBlockMarkdown('graph', data.graph); },
            toPreview: function (data) { return '<strong>Graph</strong><br>' + String((data.graph || {}).title || 'Graph'); },
          });
          CMS.registerEditorComponent({
            id: 'learn-resource',
            label: 'Resource link',
            fields: [
              { name: 'resourceType', label: 'Resource type', widget: 'select', options: ['note', 'blog', 'quiz', 'video'] },
              { name: 'resourceId', label: 'Resource', widget: 'resource_id' },
              { name: 'label', label: 'Link label (optional)', widget: 'string', required: false },
            ],
            pattern: /^```learn-resource\n([\s\S]*?)\n```$/m,
            fromBlock: function (match) { return parseEditorBlock(match); },
            toBlock: function (data) { return inlineBlockMarkdown('resource', data); },
            toPreview: function (data) { return '<strong>Resource</strong><br>' + String(data.label || data.resourceId || 'Choose a resource'); },
          });
        }

        var NotePreview = createClass({
          render: function () {
            var entry = this.props.entry;
            var title = value(entry, 'title', 'Untitled note');
            var summary = value(entry, 'summary', 'Add a short learner-facing summary.');
            var subject = value(entry, 'subjectId', 'No subject selected');
            var body = value(entry, 'body', 'Start writing the note body.');
            var slidesEnabled = value(entry, 'slidesEnabled', false);
            return h('article', { className: 'learn-preview-shell' }, [
              h('div', { className: 'learn-preview-label' }, 'Student-facing note preview'),
              h('header', { className: 'learn-preview-header' }, [
                h('div', { className: 'learn-preview-meta' }, subject + (slidesEnabled ? ' · Slides enabled' : '')),
                h('h1', null, title),
                h('p', { className: 'learn-preview-summary' }, summary),
              ]),
              h('section', { className: 'learn-preview-body' }, bodyBlocks(body)),
              h('footer', { className: 'learn-preview-footer' }, 'Preview the reading flow here, then verify the published route on desktop and mobile before classroom use.'),
            ]);
          },
        });

        var style = document.createElement('style');
        style.textContent = '.learn-resource-picker{position:relative;max-width:560px}.learn-resource-picker input{width:100%;padding:9px 10px;border:1px solid #b8c6ca;border-radius:4px}.learn-resource-results{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);max-height:280px;overflow:auto;background:#fff;border:1px solid #b8c6ca;border-radius:5px;box-shadow:0 8px 20px rgba(23,48,66,.16)}.learn-resource-result{display:block;width:100%;padding:9px 11px;border:0;border-bottom:1px solid #e4eaec;background:#fff;text-align:left;cursor:pointer}.learn-resource-result:hover{background:#f0f8f7}.learn-resource-result strong,.learn-resource-result span{display:block}.learn-resource-result span,.learn-resource-empty,.learn-resource-picker small{color:#60727a;font-size:12px}.learn-resource-empty{padding:11px}.learn-resource-picker small{display:block;margin-top:5px}';
        document.head.appendChild(style);
        CMS.registerWidget('resource_id', ResourceControl, ResourcePreview);
        registerInlineEditorComponents();
        CMS.registerPreviewTemplate('notes', NotePreview);
        CMS.registerPreviewStyle('/admin/preview.css');
      })();
    </script>
  </body>
</html>
