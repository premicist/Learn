:#333333;}#m5 .edgePaths .path{stroke:#666;stroke-width:1px;}#m5 .flowchart-link{stroke:#666;fill:none;}#m5 .edgeLabel{background-color:white;text-align:center;}#m5 .edgeLabel p{background-color:white;}#m5 .edgeLabel rect{opacity:0.5;background-color:white;fill:white;}#m5 .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#m5 .cluster rect{fill:hsl(0, 0%, 98.9215686275%);stroke:#707070;stroke-width:1px;}#m5 .cluster text{fill:#333;}#m5 .cluster span{color:#333;}#m5 .node .collapsed-indicator{fill:#707070;stroke:none;opacity:0.6;}#m5 .node .collapsed-separator{stroke:#707070;stroke-width:0.75px;}#m5 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:'Noto Sans Devanagari','Segoe UI',system-ui,sans-serif;font-size:12px;background:hsl(-160, 0%, 93.3333333333%);border:1px solid #707070;border-radius:2px;pointer-events:none;z-index:100;}#m5 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#000000;}#m5 rect.text{fill:none;stroke-width:0;}#m5 .icon-shape,#m5 .image-shape{background-color:white;text-align:center;}#m5 .icon-shape p,#m5 .image-shape p{background-color:white;padding:2px;}#m5 .icon-shape .label rect,#m5 .image-shape .label rect{opacity:0.5;background-color:white;fill:white;}#m5 .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#m5 .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#m5 .node .neo-node{stroke:#999;}#m5 [data-look="neo"].node rect,#m5 [data-look="neo"].cluster rect,#m5 [data-look="neo"].node polygon{stroke:url(#m5-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#m5 [data-look="neo"].swimlane.cluster rect{filter:none;}#m5 [data-look="neo"].node path{stroke:url(#m5-gradient);stroke-width:1px;}#m5 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#m5 [data-look="neo"].node .neo-line path{stroke:#999;filter:none;}#m5 [data-look="neo"].node circle{stroke:url(#m5-gradient);filter:drop