१. उपभोक्ताको बचत / अधिशेष (CS):</b> <br/> माग रेखा मुनि र सन्तुलन मूल्य रेखा माथिको क्षेत्र (Δ A-E-Pe)</p></span></div></foreignObject></g></g><g class="node default  " id="m5-flowchart-C-3" data-look="neo" transform="translate(490, 172)"><rect class="basic label-container" style="" x="-146" y="-48" width="292" height="96"></rect><g class="label" style="" transform="translate(-130, -36)"><rect></rect><foreignObject width="260" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>२. उत्पादकको बचत / अधिशेष (PS):</b> <br/> सन्तुलन मूल्य रेखा मुनि र आपूर्ति रेखा माथिको क्षेत्र (Δ Pe-E-B)</p></span></div></foreignObject></g></g><g class="node default  " id="m5-flowchart-D-5" data-look="neo" transform="translate(324, 320)"><rect class="basic label-container" style="" x="-146" y="-60" width="292" height="120"></rect><g class="label" style="" transform="translate(-130, -48)"><rect></rect><foreignObject width="260" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>कुल आर्थिक अधिशेष / सामाजिक कल्याण:</b> <br/> Total Surplus = CS + PS (त्रिभुज A-E-B)</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="m5-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><defs><filter id="m5-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><linearGradient id="m5-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="hsl(0, 0%, 83.3333333333%)" stop-opacity="1"></stop><stop offset="100%" stop-color="h