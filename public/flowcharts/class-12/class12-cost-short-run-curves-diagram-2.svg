g class="node default  " id="m50-flowchart-TC-6" data-look="neo" transform="translate(822, 184)"><rect class="basic label-container" style="" x="-146" y="-84" width="292" height="168"></rect><g class="label" style="" transform="translate(-130, -72)"><rect></rect><foreignObject width="260" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>TC Curve:</b><br/>• Starts at (0, TFC) intercept on vertical axis<br/>• Exactly parallel to TVC curve<br/>• Vertical distance TC − TVC = TFC at all points</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="m50-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><defs><filter id="m50-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><linearGradient id="m50-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="hsl(0, 0%, 83.3333333333%)" stop-opacity="1"></stop><stop offset="100%" stop-color="hsl(0, 0%, 88.9215686275%)" stop-opacity="1"></stop></linearGradient></svg>