iOjgxOS43NSwieSI6MTI0fV0=" data-look="neo" marker-end="url(#m106_flowchart-v2-pointEnd-margin)"></path></g><g class="edgeLabels"></g><g class="nodes"><g class="node default  " id="m106-flowchart-Curves-0" data-look="neo" transform="translate(488.875, 48)"><rect class="basic label-container" style="" x="-146" y="-36" width="292" height="72"></rect><g class="label" style="" transform="translate(-130, -24)"><rect></rect><foreignObject width="260" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>Shapes of Revenue Curves under Monopoly</b></p></span></div></foreignObject></g></g><g class="node default  " id="m106-flowchart-TR-2" data-look="neo" transform="translate(158, 220)"><rect class="basic label-container" style="" x="-146" y="-96" width="292" height="192"></rect><g class="label" style="" transform="translate(-130, -84)"><rect></rect><foreignObject width="260" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>TR Curve (Panel A)</b><br/>• Inverted U-shape (Parabolic)<br/>• Rises at a diminishing rate when MR &gt; 0<br/>• Reaches maximum peak when MR = 0<br/>• Declines when MR &lt; 0</p></span></div></foreignObject></g></g><g class="node default  " id="m106-flowchart-AR-4" data-look="neo" transform="translate(488.875, 184)"><rect class="basic label-container" style="" x="-144.875" y="-60" width="289.75" height="120"></rect><g class="label" style="" transform="translate(-128.875, -48)"><rect></rect><foreignObject width="257.75" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;"><span class="nodeLabel "><p><b>AR Curve (Panel B)</b><br/>• Slopes downward from left to right<br/>• Represents firm's demand curve<br/>• Remains positive as long as P &gt; 0</p></span></div></foreignObject></g></g><g class="node default  " id="m106-flowchart-MR-6" data-look="neo" transform="translate(819.75, 244)"><rect class="basic label-container" style="" x="-146" y="-120" width="292" height="240"></rect><g class="label" style="" transform="translate(-130, -108)"><rect></rect><foreignObject width="260" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>MR Curve (Panel B)</b><br/>• Slopes downward twice as steeply as AR<br/>• Lies below AR at all output levels (AR &gt; MR)<br/>• Intersects horizontal axis at Q = 6 where TR is maximum<br/>• Dips into negative territory when TR declines</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="m106-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><defs><filter id="m106-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><linearGradient id="m106-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="hsl(0, 0%, 83.3333333333%)" stop-opacity="1"></stop><stop offset="100%" stop-color="hsl(0, 0%, 88.9215686275%)" stop-opacity="1"></stop></linearGradient></svg>