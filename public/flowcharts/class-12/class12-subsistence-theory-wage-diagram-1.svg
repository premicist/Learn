><g class="edgeLabels"></g><g class="nodes"><g class="node default  " id="m115-flowchart-ST-0" data-look="neo" transform="translate(490, 48)"><rect class="basic label-container" style="" x="-146" y="-36" width="292" height="72"></rect><g class="label" style="" transform="translate(-130, -24)"><rect></rect><foreignObject width="260" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>Subsistence Theory of Wages (Iron Law of Wages)</b></p></span></div></foreignObject></g></g><g class="node default  " id="m115-flowchart-High-2" data-look="neo" transform="translate(158, 196)"><rect class="basic label-container" style="" x="-146" y="-72" width="292" height="144"></rect><g class="label" style="" transform="translate(-130, -60)"><rect></rect><foreignObject width="260" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>If Wage &gt; Subsistence:</b><br/>Living standards rise ? Population &amp; Labour Supply grow ? Competition among workers ? <b>Wage FALLS to Subsistence</b></p></span></div></foreignObject></g></g><g class="node default  " id="m115-flowchart-Low-4" data-look="neo" transform="translate(490, 196)"><rect class="basic label-container" style="" x="-146" y="-72" width="292" height="144"></rect><g class="label" style="" transform="translate(-130, -60)"><rect></rect><foreignObject width="260" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>If Wage &lt; Subsistence:</b><br/>Poverty &amp; Malnutrition rise ? Labour Supply contracts ? Employers compete for scarce labour ? <b>Wage RISES to Subsistence</b></p></span></div></foreignObject></g></g><g class="node default  " id="m115-flowchart-Eq-6" data-look="neo" transform="translate(822, 172)"><rect class="basic label-container" style="" x="-146" y="-48" width="292" height="96"></rect><g class="label" style="" transform="translate(-130, -36)"><rect></rect><foreignObject width="260" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>Long-Run Equilibrium:</b><br/>Wage Rate = Bare Minimum Subsistence Level</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="m115-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><defs><filter id="m115-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><linearGradient id="m115-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="hsl(0, 0%, 83.3333333333%)" stop-opacity="1"></stop><stop offset="100%" stop-color="hsl(0, 0%, 88.9215686275%)" stop-opacity="1"></stop></linearGradient></svg>