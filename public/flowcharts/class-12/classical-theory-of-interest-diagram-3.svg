y phenomenon (Liquidity Preference), not purely real</p></span></div></foreignObject></g></g><g class="node default  " id="m123-flowchart-C2-4" data-look="neo" transform="translate(490, 180)"><rect class="basic label-container" style="" x="-146" y="-60" width="292" height="120"></rect><g class="label" style="" transform="translate(-130, -48)"><rect></rect><foreignObject width="260" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>2. Indeterminate Theory:</b> Savings depend on Income (Y), but Income cannot be known without Interest rate</p></span></div></foreignObject></g></g><g class="node default  " id="m123-flowchart-C3-6" data-look="neo" transform="translate(822, 180)"><rect class="basic label-container" style="" x="-146" y="-60" width="292" height="120"></rect><g class="label" style="" transform="translate(-130, -48)"><rect></rect><foreignObject width="260" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>3. Unrealistic Full Employment:</b> Real economies regularly operate with idle resources and unemployment</p></span></div></foreignObject></g></g><g class="node default  " id="m123-flowchart-C4-8" data-look="neo" transform="translate(1154, 180)"><rect class="basic label-container" style="" x="-146" y="-60" width="292" height="120"></rect><g class="label" style="" transform="translate(-130, -48)"><rect></rect><foreignObject width="260" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>4. Ignores Bank Credit Creation:</b> Commercial banks create credit out of nothing, not just from prior savings</p></s