"><span class="nodeLabel "><p><b>Major Criticisms of Ricardian Rent</b></p></span></div></foreignObject></g></g><g class="node default  " id="m114-flowchart-C1-2" data-look="neo" transform="translate(158, 168)"><rect class="basic label-container" style="" x="-146" y="-48" width="292" height="96"></rect><g class="label" style="" transform="translate(-130, -36)"><rect></rect><foreignObject width="260" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>1. No Indestructible Power:</b> Continuous cultivation depletes soil fertility</p></span></div></foreignObject></g></g><g class="node default  " id="m114-flowchart-C2-4" data-look="neo" transform="translate(490, 168)"><rect class="basic label-container" style="" x="-146" y="-48" width="292" height="96"></rect><g class="label" style="" transform="translate(-130, -36)"><rect></rect><foreignObject width="260" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>2. Historical Order of Cultivation is Wrong:</b> Settlements cultivate accessible land first, not most fertile</p></span></div></foreignObject></g></g><g class="node default  " id="m114-flowchart-C3-6" data-look="neo" transform="translate(822, 168)"><rect class="basic label-container" style="" x="-146" y="-48" width="292" height="96"></rect><g class="label" style="" transform="translate(-130, -36)"><rect></rect><foreignObject width="260" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>3. Marginal (No-Rent) Land Does Not Exist:</b> Even inferior land earns some rent in reality</p></span></div></foreignObject></g></g><g class="node default  " id="m114-flowchart-C4-8" data-look="neo" transform="translate(1154, 168)"><rect class="basic label-container" style="" x="-146" y="-48" width="292" height="96"></rect><g class="label" style="" transform="translate(-130, -36)"><rect></rect><foreignObject width="260" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>4. Narrow Scope:</b> Rent arises on all scarce factors, not just agricultural land</p></span></div></foreignObject></g></g><g class="node default  " id="m114-flowchart-C5-10" data-look="neo" transform="translate(1486, 168)"><rect class="basic label-container" style="" x="-146" y="-48" width="292" height="96"></rect><g class="label" style="" transform="translate(-130, -36)"><rect></rect><foreignObject width="260" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>5. Assumes Single Use:</b> Ignores alternative uses (housing, industries, commercial parks)</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="m114-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><defs><filter id="m114-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><linearGradient id="m114-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="hsl(0, 0%, 83.3333333333%)" stop-opacity="1"></stop><stop offset="100%" stop-color="hsl(0, 0%, 88.9215686275%)" stop-opacity="1"></stop></linearGradient></svg>