<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="100%" height="auto" role="img" aria-label="Firm Equilibrium: Total Revenue and Total Cost (TR-TC) Approach">
  <style>
    .bg { fill: #ffffff; stroke: #111111; stroke-width: 1.5; }
    .axis { stroke: #1e293b; stroke-width: 2; stroke-linecap: round; }
    .tr-curve { fill: none; stroke: #2563eb; stroke-width: 3.5; stroke-linecap: round; }
    .tc-curve { fill: none; stroke: #dc2626; stroke-width: 3.5; stroke-linecap: round; }
    .guide-line { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .point-dot { fill: #1e293b; stroke: #ffffff; stroke-width: 2.5; }
    .profit-bracket { stroke: #16a34a; stroke-width: 3; }
    .text-title { font-family: 'Manrope', system-ui, sans-serif; font-size: 15px; font-weight: 800; fill: #0f172a; }
    .text-label { font-family: 'Manrope', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }
    .text-sub { font-family: 'Manrope', system-ui, sans-serif; font-size: 11.5px; font-weight: 600; fill: #475569; }
    .tag-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 6; }
    .profit-fill { fill: #dcfce7; opacity: 0.6; }
  </style>

  <rect class="bg" width="100%" height="100%" rx="10"/>
  <text class="text-title" x="40" y="32">Equilibrium of the Firm: TR-TC Approach</text>
  <text class="text-sub" x="40" y="50">Profit is maximized at output Q* where the vertical distance (TR − TC) is greatest</text>

  <!-- Axes -->
  <line class="axis" x1="80" y1="380" x2="80" y2="70"/>
  <line class="axis" x1="80" y1="380" x2="700" y2="380"/>
  <text class="text-label" x="15" y="80">TR, TC (Rs.)</text>
  <text class="text-label" x="620" y="405">Output (Q)</text>
  <text class="text-label" x="65" y="395">O</text>

  <!-- Total Revenue Curve (TR Linear Ray) -->
  <line class="tr-curve" x1="80" y1="380" x2="650" y2="100"/>
  <text class="text-label" x="655" y="105" fill="#2563eb">TR</text>

  <!-- Total Cost Curve (TC Inverted S from TFC > 0) -->
  <!-- Starts at (80, 310), intersects TR at B1 (230, 306) and B2 (530, 160) -->
  <path class="tc-curve" d="M 80 310 C 160 300, 200 310, 270 290 C 370 260, 430 230, 480 190 C 530 150, 580 80, 630 40"/>
  <text class="text-label" x="635" y="45" fill="#dc2626">TC</text>
  <text class="text-label" x="40" y="315" fill="#dc2626">TFC</text>

  <!-- Break-Even Point 1 (B1 at x = 232, y = 305) -->
  <circle class="point-dot" cx="232" cy="305" r="5" fill="#1e293b"/>
  <line class="guide-line" x1="232" y1="305" x2="232" y2="380"/>
  <text class="text-label" x="220" y="290">B1 (TR = TC)</text>
  <text class="text-label" x="225" y="398">Q1</text>

  <!-- Break-Even Point 2 (B2 at x = 525, y = 162) -->
  <circle class="point-dot" cx="525" cy="162" r="5" fill="#1e293b"/>
  <line class="guide-line" x1="525" y1="162" x2="525" y2="380"/>
  <text class="text-label" x="535" y="160">B2 (TR = TC)</text>
  <text class="text-label" x="520" y="398">Q2</text>

  <!-- Maximum Profit Point (Q* at x = 380) -->
  <!-- TR at x=380 is y = 232. TC at x=380 is y = 250... wait, let's mark max gap at x = 380 -->
  <line class="profit-bracket" x1="380" y1="232" x2="380" y2="258"/>
  <line class="guide-line" x1="380" y1="70" x2="380" y2="380"/>
  <circle class="point-dot" cx="380" cy="232" r="5" fill="#2563eb"/>
  <circle class="point-dot" cx="380" cy="258" r="5" fill="#dc2626"/>
  <text class="text-label" x="385" y="245" fill="#16a34a">Max Profit Gap (M)</text>
  <text class="text-label" x="375" y="400" fill="#16a34a">Q* (Equilibrium)</text>

  <!-- Annotations / Zones -->
  <text class="text-sub" x="120" y="340" fill="#dc2626">Loss Zone (TC &gt; TR)</text>
  <text class="text-sub" x="340" y="330" fill="#16a34a"><b>Profit Zone (TR &gt; TC)</b></text>
  <text class="text-sub" x="560" y="110" fill="#dc2626">Loss Zone (TC &gt; TR)</text>

  <g transform="translate(100, 90)">
    <rect class="tag-box" width="220" height="75"/>
    <text class="text-sub" x="10" y="20">• <b>B1, B2:</b> Break-even points (Profit = 0)</text>
    <text class="text-sub" x="10" y="40">• <b>Between B1 &amp; B2:</b> Firm earns profit</text>
    <text class="text-sub" x="10" y="60">• <b>At Q*:</b> Slopes are equal (MR = MC)</text>
  </g>
</svg>