  <text class="rg" x="595" y="430" fill="#9a3022">ऋणात्मक क्षेत्र (Disutility: MU &lt; 0)</text>

  <text class="fn" x="30" y="628">MU = ΔTU ÷ ΔQ = TU वक्रको ढल (Slope)।  उदाहरणात्मक मान: TU = १०Q − Q²,  MU = १० − २Q।</text>
