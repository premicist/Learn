<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 642" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">ह्रासमान सीमान्त उपयोगिताको नियम: TU र MU (Law of Diminishing Marginal Utility)</title>
  <desc id="d">माथि कुल उपयोगिता (TU) पाँचौँ एकाइमा अधिकतम हुन्छ। तल सीमान्त उपयोगिता (MU) घट्दै गई पाँचौँ एकाइमा शून्य हुन्छ र त्यसपछि ऋणात्मक हुन्छ। MU भनेको TU को ढल हो। TU peaks at the 5th unit where MU = 0; MU is the slope of TU.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#111827"/>
    </marker>
  </defs>
