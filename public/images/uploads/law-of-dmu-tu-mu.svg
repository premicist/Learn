    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 3.5px; stroke-linejoin: round; }
    .axt { font-size: 12.5px; font-weight: 700; fill: #374151; text-anchor: middle; }
    .tu { fill: none; stroke: #146b63; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
    .mu { fill: none; stroke: #b23a2b; stroke-width: 3.6; stroke-linecap: round; }
    .gd { stroke: #5b7186; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .tg { stroke: #b23a2b; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 7 4; }
    .dot-s { fill: #ffffff; stroke: #b23a2b; stroke-width: 2.2; }
    .dot-k { fill: #122a3a; stroke: #ffffff; stroke-width: 2.5; }
