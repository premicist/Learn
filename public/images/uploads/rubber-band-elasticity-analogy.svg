<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 454" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">लोचको भौतिक दृष्टान्त: रबर ब्यान्डको उदाहरण (Rubber Band Analogy)</title>
  <desc id="d">उही बल (मूल्य परिवर्तन २०%) लगाउँदा नरम रबर ब्यान्ड ४०% तानिन्छ (Ep = २) तर कडा डोरी १०% मात्र तानिन्छ (Ep = ०.५)। Same pull stretches a soft rubber band 40% but a stiff cord only 10%.</desc>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#e2e8f0"/><line x1="0" y1="0" x2="0" y2="6" stroke="#94a3b8" stroke-width="2"/>
    </pattern>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#c2410c"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans Devanagari', 'Mukta', 'Nirmala UI', 'Mangal', 'Segoe UI', sans-serif; }
    .main { font-size: 18px; font-weight: 700; fill: #122a3a; }
    .sub { font-size: 12.5px; font-weight: 500; fill: #475569; }
    .card { fill: #f6f8f7; stroke: #d3dedb; stroke-width: 1.3; }
    .ct { font-size: 15.5px; font-weight: 700; }
    .tg { font-size: 12.5px; font-weight: 600; }
    .rl { font-size: 12px; font-weight: 600; fill: #475569; }
    .gd { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .pull { stroke: #c2410c; stroke-width: 3; stroke-linecap: round; }
    .dp { font-size: 12.5px; font-weight: 700; fill: #c2410c; text-anchor: middle; }
    .bq { stroke: #1d4ed8; stroke-width: 1.8; stroke-linecap: round; }
    .dq { font-size: 12.5px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; }
    .rs { font-size: 14.5px; font-weight: 700; }
    .sm { font-size: 12px; font-weight: 700; fill: #122a3a; }
    .eg { font-size: 11.5px; font-weight: 500; fill: #52667a; }
    .fn { font-size: 11px; font-weight: 500; fill: #64748b; }
  </style>

  <rect x="0.75" y="0.75" width="778.5" height="452.5" rx="12" fill="#ffffff" stroke="#d3dedb" stroke-width="1.5"/>
  <text class="main" x="30" y="36">लोचको भौतिक दृष्टान्त: रबर ब्यान्डको उदाहरण (Rubber Band Analogy)</text>
  <text class="sub" x="30" y="59">लोच (Elasticity) भनेको बाह्य बल (मूल्य) ले पार्ने प्रभाव अनुसार वस्तुको परिमाणमा आउने तन्काइ वा लचकता हो।</text>
  <text class="sub" x="30" y="77"><tspan fill="#c2410c" font-weight="700">सुन्तला: बल = मूल्य परिवर्तन (ΔP)</tspan>   <tspan fill="#1d4ed8" font-weight="700">निलो: तन्काइ = माग परिवर्तन (ΔQ)</tspan></text>
  
  <g transform="translate(30, 90)">
    <rect class="card" width="345" height="328" rx="10"/>
    <text class="ct" x="20" y="31" fill="#146b63">१. लोचदार अवस्था (Elastic: Ep &gt; 1)</text>
    <text class="tg" x="20" y="51" fill="#0e4a45">नरम रबर ब्यान्ड (Highly Stretchable)</text>

    <!-- BEFORE -->
    <text class="rl" x="20" y="84">सुरुको अवस्था (Initial)</text>
    <rect x="22" y="92" width="12" height="40" rx="2" fill="url(#hatch)" stroke="#64748b" stroke-width="1.2"/><line x1="34" y1="112" x2="46" y2="112" stroke="#64748b" stroke-width="2"/>
    <path d="M 46 103.5 H 166 A 8.5 8.5 0 0 1 166 120.5 H 46 A 8.5 8.5 0 0 1 46 103.5 Z" fill="none" stroke="#146b63" stroke-width="5" stroke-linejoin="round" opacity="1.0"/><path d="M 46 103.5 H 166 A 8.5 8.5 0 0 1 166 120.5 H 46 A 8.5 8.5 0 0 1 46 103.5 Z" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
    <circle cx="46" cy="112" r="5.5" fill="#ffffff" stroke="#334155" stroke-width="2"/><circle cx="166" cy="112" r="5.5" fill="#ffffff" stroke="#334155" stroke-width="2"/>

    <!-- guide marking the relaxed length -->
    <line class="gd" x1="166" y1="126" x2="166" y2="222"/>

    <!-- AFTER (same pull) -->
    <text class="rl" x="20" y="152">मूल्य परिवर्तन हुँदा (Stretched)</text>
    <rect x="22" y="164" width="12" height="40" rx="2" fill="url(#hatch)" stroke="#64748b" stroke-width="1.2"/><line x1="34" y1="184" x2="46" y2="184" stroke="#64748b" stroke-width="2"/>
    <path d="M 46 175.5 H 214 A 8.5 8.5 0 0 1 214 192.5 H 46 A 8.5 8.5 0 0 1 46 175.5 Z" fill="none" stroke="#146b63" stroke-width="3.4" stroke-linejoin="round" opacity="1.0"/><path d="M 46 175.5 H 214 A 8.5 8.5 0 0 1 214 192.5 H 46 A 8.5 8.5 0 0 1 46 175.5 Z" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
    <circle cx="46" cy="184" r="5.5" fill="#ffffff" stroke="#334155" stroke-width="2"/><circle cx="214" cy="184" r="5.5" fill="#fde7d8" stroke="#334155" stroke-width="2"/>

    <!-- pull arrow: identical in both cards (orange = price change) -->
    <line class="pull" x1="232" y1="184" x2="294" y2="184" marker-end="url(#arrP)"/>
    <text class="dp" x="263" y="174">ΔP +२०%</text>

    <!-- stretch bracket (blue = quantity change) -->
    <line class="bq" x1="166" y1="218" x2="214" y2="218"/>
    <line class="bq" x1="166" y1="212" x2="166" y2="224"/>
    <line class="bq" x1="214" y1="212" x2="214" y2="224"/>
    <text class="dq" x="190.0" y="239">ΔQ +४०%</text>

    <!-- result -->
    <line x1="20" y1="256" x2="325" y2="256" stroke="#dbe4e0" stroke-width="1.2"/>
    <text class="rs" x="20" y="277" fill="#146b63">Ep = ४० ÷ २० = २  (&gt; १)</text>
    <text class="sm" x="20" y="297">उही मूल्य परिवर्तन (ΔP) ⇒ ठूलो माग परिवर्तन (ΔQ)</text>
    <text class="eg" x="20" y="315">उदाहरण: विलासिताका सामान (कार, सुन, स्मार्टफोन)</text>
  </g>
  
  <g transform="translate(405, 90)">
    <rect class="card" width="345" height="328" rx="10"/>
    <text class="ct" x="20" y="31" fill="#b23a2b">२. बेलोचदार अवस्था (Inelastic: Ep &lt; 1)</text>
    <text class="tg" x="20" y="51" fill="#781d13">कडा डोरी (Rigid Cord / Stiff Band)</text>

    <!-- BEFORE -->
    <text class="rl" x="20" y="84">सुरुको अवस्था (Initial)</text>
    <rect x="22" y="92" width="12" height="40" rx="2" fill="url(#hatch)" stroke="#64748b" stroke-width="1.2"/><line x1="34" y1="112" x2="46" y2="112" stroke="#64748b" stroke-width="2"/>
    <path d="M 46 103.5 H 166 A 8.5 8.5 0 0 1 166 120.5 H 46 A 8.5 8.5 0 0 1 46 103.5 Z" fill="none" stroke="#b23a2b" stroke-width="8" stroke-linejoin="round" opacity="1.0"/><path d="M 46 103.5 H 166 A 8.5 8.5 0 0 1 166 120.5 H 46 A 8.5 8.5 0 0 1 46 103.5 Z" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="3 5" opacity="0.55"/>
    <circle cx="46" cy="112" r="5.5" fill="#ffffff" stroke="#334155" stroke-width="2"/><circle cx="166" cy="112" r="5.5" fill="#ffffff" stroke="#334155" stroke-width="2"/>

    <!-- guide marking the relaxed length -->
    <line class="gd" x1="166" y1="126" x2="166" y2="222"/>

    <!-- AFTER (same pull) -->
    <text class="rl" x="20" y="152">मूल्य परिवर्तन हुँदा (Resists Stretch)</text>
    <rect x="22" y="164" width="12" height="40" rx="2" fill="url(#hatch)" stroke="#64748b" stroke-width="1.2"/><line x1="34" y1="184" x2="46" y2="184" stroke="#64748b" stroke-width="2"/>
    <path d="M 46 175.5 H 178 A 8.5 8.5 0 0 1 178 192.5 H 46 A 8.5 8.5 0 0 1 46 175.5 Z" fill="none" stroke="#b23a2b" stroke-width="8" stroke-linejoin="round" opacity="1.0"/><path d="M 46 175.5 H 178 A 8.5 8.5 0 0 1 178 192.5 H 46 A 8.5 8.5 0 0 1 46 175.5 Z" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="3 5" opacity="0.55"/>
    <circle cx="46" cy="184" r="5.5" fill="#ffffff" stroke="#334155" stroke-width="2"/><circle cx="178" cy="184" r="5.5" fill="#fde7d8" stroke="#334155" stroke-width="2"/>

    <!-- pull arrow: identical in both cards (orange = price change) -->
    <line class="pull" x1="196" y1="184" x2="258" y2="184" marker-end="url(#arrP)"/>
    <text class="dp" x="227" y="174">ΔP +२०%</text>

    <!-- stretch bracket (blue = quantity change) -->
    <line class="bq" x1="166" y1="218" x2="178" y2="218"/>
    <line class="bq" x1="166" y1="212" x2="166" y2="224"/>
    <line class="bq" x1="178" y1="212" x2="178" y2="224"/>
    <text class="dq" x="172.0" y="239">ΔQ +१०%</text>

    <!-- result -->
    <line x1="20" y1="256" x2="325" y2="256" stroke="#dbe4e0" stroke-width="1.2"/>
    <text class="rs" x="20" y="277" fill="#b23a2b">Ep = १० ÷ २० = ०.५  (&lt; १)</text>
    <text class="sm" x="20" y="297">उही मूल्य परिवर्तन (ΔP) ⇒ थोरै मात्र माग परिवर्तन (ΔQ)</text>
    <text class="eg" x="20" y="315">उदाहरण: अत्यावश्यक वस्तुहरू (नुन, खाद्यान्न, औषधि)</text>
  </g>
  <text class="fn" x="30" y="440">नोट: मूल्य बढ्दा माग घट्छ; यहाँ परिवर्तनको आकार (निरपेक्ष मान) मात्र देखाइएको छ। Ep = |%ΔQ ÷ %ΔP|। उदाहरणात्मक मान।</text>
</svg>
