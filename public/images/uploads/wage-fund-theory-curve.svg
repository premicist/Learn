<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="100%" height="auto" role="img" aria-label="Wage Fund Theory: Inverse Relationship between Number of Workers and Wage Rate">
  <style>
    .bg { fill: #ffffff; stroke: #111111; stroke-width: 1.5; }
    .axis { stroke: #1e293b; stroke-width: 2; stroke-linecap: round; }
    .wage-curve { fill: none; stroke: #2563eb; stroke-width: 3.5; stroke-linecap: round; }
    .guide-line { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .point-dot { fill: #1e293b; stroke: #ffffff; stroke-width: 2.5; }
    .text-title { font-family: 'Manrope', system-ui, sans-serif; font-size: 15px; font-weight: 800; fill: #0f172a; }
    .text-label { font-family: 'Manrope', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }
    .text-sub { font-family: 'Manrope', system-ui, sans-serif; font-size: 11.5px; font-weight: 600; fill: #475569; }
    .tag-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 6; }
  </style>

  <rect class="bg" width="100%" height="100%" rx="10"/>
  <text class="text-title" x="40" y="32">Wage Fund Theory: Relationship between Labour Supply and Wage Rate</text>
  <text class="text-sub" x="40" y="50">Average Wage Rate = Total Wage Fund (WF) / Number of Workers (NW) (Given WF = Rs. 20,000)</text>

  <!-- Axes -->
  <line class="axis" x1="80" y1="380" x2="80" y2="70"/>
  <line class="axis" x1="80" y1="380" x2="700" y2="380"/>
  <text class="text-label" x="15" y="80">Wage Rate (Rs.)</text>
  <text class="text-label" x="580" y="405">Number of Workers (NW)</text>
  <text class="text-label" x="65" y="395">O</text>

  <!-- Hyperbolic Downward-Sloping Wage Curve -->
  <path class="wage-curve" d="M 120 120 Q 240 300 620 345"/>
  <text class="text-label" x="630" y="348" fill="#2563eb">W = WF / NW</text>

  <!-- Point A (100 workers, Rs. 200) -> x = 180, y = 140 -->
  <circle class="point-dot" cx="180" cy="140" r="5" fill="#2563eb"/>
  <line class="guide-line" x1="80" y1="140" x2="180" y2="140"/>
  <line class="guide-line" x1="180" y1="140" x2="180" y2="380"/>
  <text class="text-label" x="25" y="145">Rs. 200</text>
  <text class="text-label" x="170" y="400">100</text>
  <text class="text-label" x="190" y="135">A (100, Rs. 200)</text>

  <!-- Point B (200 workers, Rs. 100) -> x = 340, y = 240 -->
  <circle class="point-dot" cx="340" cy="240" r="5" fill="#2563eb"/>
  <line class="guide-line" x1="80" y1="240" x2="340" y2="240"/>
  <line class="guide-line" x1="340" y1="240" x2="340" y2="380"/>
  <text class="text-label" x="25" y="245">Rs. 100</text>
  <text class="text-label" x="330" y="400">200</text>
  <text class="text-label" x="350" y="235">B (200, Rs. 100)</text>

  <!-- Point C (400 workers, Rs. 50) -> x = 540, y = 320 -->
  <circle class="point-dot" cx="540" cy="320" r="5" fill="#2563eb"/>
  <line class="guide-line" x1="80" y1="320" x2="540" y2="320"/>
  <line class="guide-line" x1="540" y1="320" x2="540" y2="380"/>
  <text class="text-label" x="30" y="325">Rs. 50</text>
  <text class="text-label" x="530" y="400">400</text>
  <text class="text-label" x="550" y="315">C (400, Rs. 50)</text>

  <!-- Explanatory Box -->
  <g transform="translate(380, 80)">
    <rect class="tag-box" width="280" height="75"/>
    <text class="text-sub" x="10" y="20">• <b>Fixed Wage Fund:</b> Hyperbolic curve</text>
    <text class="text-sub" x="10" y="40">• <b>Doubling Labour (100 → 200):</b> Wage halves</text>
    <text class="text-sub" x="10" y="60">• <b>To raise wages:</b> ↑ Fund or ↓ Population</text>
  </g>
</svg>