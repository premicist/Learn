<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 445" width="100%" height="auto" role="img" aria-label="Short-Run Outcomes for a Perfectly Competitive Firm: Supernormal Profit, Normal Profit, and Loss with Shutdown Point">
  <defs>
    <pattern id="shading" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#333333" stroke-width="1.2"/>
    </pattern>
  </defs>
  <style>
    .bg { fill: #ffffff; stroke: #111111; stroke-width: 1.5; }
    .axis { stroke: #111111; stroke-width: 2; stroke-linecap: round; }
    .curve { fill: none; stroke: #111111; stroke-width: 3; stroke-linecap: round; }
    .curve-thin { fill: none; stroke: #111111; stroke-width: 2.5; stroke-linecap: round; }
    .price-line { stroke: #111111; stroke-width: 3.5; stroke-linecap: round; }
    .guide-line { stroke: #666666; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .point-dot { fill: #111111; stroke: #ffffff; stroke-width: 2; }
    .shade { fill: url(#shading); }
    .text-title { font-family: 'Manrope', system-ui, sans-serif; font-size: 14px; font-weight: 800; fill: #111111; text-anchor: middle; }
    .text-label { font-family: 'Manrope', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #111111; }
    .text-sub { font-family: 'Manrope', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #333333; text-anchor: middle; }
    .card { fill: #ffffff; stroke: #111111; stroke-width: 1.2; }
  </style>

  <rect class="bg" width="100%" height="100%" rx="10"/>

  <!-- Panel 1: Supernormal Profit (P above Min SAC) -->
  <g transform="translate(20, 20)">
    <rect class="card" width="236" height="390" rx="8"/>
    <text class="text-title" x="118" y="30">1. Supernormal Profit</text>
    <text class="text-sub" x="118" y="48">Price above minimum SAC</text>

    <line class="axis" x1="35" y1="320" x2="35" y2="90"/>
    <line class="axis" x1="35" y1="320" x2="205" y2="320"/>
    <text class="text-sub" x="12" y="205" transform="rotate(-90 12 205)">Price / Cost</text>
    <text class="text-label" x="24" y="336">O</text>

    <!-- SAC (U, min at 125,200) -->
    <path class="curve-thin" d="M 55 140 Q 125 260 195 140"/>
    <text class="text-label" x="198" y="145">SAC</text>
    <!-- SAVC (U, min at 95,248) -->
    <path class="curve-thin" d="M 50 190 Q 95 306 140 190"/>
    <text class="text-label" x="144" y="186">SAVC</text>
    <!-- SMC: falls, min ~(89,255), cuts SAVC at its min and SAC at its min, rises steeply -->
    <path class="curve" d="M 60 120 Q 78 285 95 248 Q 107 220 125 200 C 137 181 150 125 160 95"/>
    <text class="text-label" x="164" y="99">SMC</text>

    <!-- Price line P at y=155 -->
    <line class="price-line" x1="35" y1="155" x2="205" y2="155"/>
    <text class="text-label" x="24" y="150">P</text>

    <!-- Equilibrium e where rising SMC = P, at (142,155) -->
    <circle class="point-dot" cx="142" cy="155" r="5"/>
    <text class="text-label" x="151" y="147">e</text>
    <line class="guide-line" x1="142" y1="155" x2="142" y2="320"/>
    <text class="text-label" x="142" y="336" text-anchor="middle">q*</text>

    <!-- Profit rectangle: price line to SAC at q* -->
    <polygon class="shade" points="35,155 142,155 142,196.5 35,196.5"/>
    <text class="text-label" x="88" y="180" text-anchor="middle">Profit</text>

    <text class="text-sub" x="118" y="358">P &gt; Min SAC</text>
    <text class="text-sub" x="118" y="376">Profit = (P − SAC) × q*</text>
  </g>

  <!-- Panel 2: Normal Profit (P = Min SAC) -->
  <g transform="translate(272, 20)">
    <rect class="card" width="236" height="390" rx="8"/>
    <text class="text-title" x="118" y="30">2. Normal Profit</text>
    <text class="text-sub" x="118" y="48">Price equals minimum SAC</text>

    <line class="axis" x1="35" y1="320" x2="35" y2="90"/>
    <line class="axis" x1="35" y1="320" x2="205" y2="320"/>
    <text class="text-sub" x="12" y="205" transform="rotate(-90 12 205)">Price / Cost</text>
    <text class="text-label" x="24" y="336">O</text>

    <path class="curve-thin" d="M 55 140 Q 125 260 195 140"/>
    <text class="text-label" x="198" y="145">SAC</text>
    <path class="curve-thin" d="M 50 190 Q 95 306 140 190"/>
    <text class="text-label" x="144" y="186">SAVC</text>
    <path class="curve" d="M 60 120 Q 78 285 95 248 Q 107 220 125 200 C 137 181 150 125 160 95"/>
    <text class="text-label" x="164" y="99">SMC</text>

    <!-- Price line tangent to SAC at its minimum -->
    <line class="price-line" x1="35" y1="200" x2="205" y2="200"/>
    <text class="text-label" x="24" y="195">P</text>

    <circle class="point-dot" cx="125" cy="200" r="5"/>
    <text class="text-label" x="133" y="193">e</text>
    <line class="guide-line" x1="125" y1="200" x2="125" y2="320"/>
    <text class="text-label" x="125" y="336" text-anchor="middle">q*</text>

    <text class="text-sub" x="118" y="358">P = Min SAC</text>
    <text class="text-sub" x="118" y="376">Normal profit (zero econ. profit)</text>
  </g>

  <!-- Panel 3: Loss (Min SAVC &lt; P &lt; Min SAC) -->
  <g transform="translate(524, 20)">
    <rect class="card" width="236" height="390" rx="8"/>
    <text class="text-title" x="118" y="30">3. Loss (still produces)</text>
    <text class="text-sub" x="118" y="48">Price below minimum SAC</text>

    <line class="axis" x1="35" y1="320" x2="35" y2="90"/>
    <line class="axis" x1="35" y1="320" x2="205" y2="320"/>
    <text class="text-sub" x="12" y="205" transform="rotate(-90 12 205)">Price / Cost</text>
    <text class="text-label" x="24" y="336">O</text>

    <path class="curve-thin" d="M 55 140 Q 125 260 195 140"/>
    <text class="text-label" x="198" y="145">SAC</text>
    <path class="curve-thin" d="M 50 190 Q 95 306 140 190"/>
    <text class="text-label" x="144" y="186">SAVC</text>
    <path class="curve" d="M 60 120 Q 78 285 95 248 Q 107 220 125 200 C 137 181 150 125 160 95"/>
    <text class="text-label" x="164" y="99">SMC</text>

    <!-- Shutdown point at the minimum of SAVC -->
    <line class="guide-line" x1="35" y1="248" x2="95" y2="248"/>
    <circle class="point-dot" cx="95" cy="248" r="4"/>
    <text class="text-label" x="86" y="242">S</text>

    <!-- Price line below minimum SAC -->
    <line class="price-line" x1="35" y1="225" x2="205" y2="225"/>
    <text class="text-label" x="24" y="220">P</text>

    <circle class="point-dot" cx="107" cy="225" r="5"/>
    <text class="text-label" x="115" y="218">e</text>
    <line class="guide-line" x1="107" y1="225" x2="107" y2="320"/>
    <text class="text-label" x="107" y="336" text-anchor="middle">q*</text>

    <!-- Loss rectangle: price line to SAC at q* -->
    <polygon class="shade" points="35,196 107,196 107,225 35,225"/>
    <text class="text-label" x="70" y="214" text-anchor="middle">Loss</text>

    <text class="text-sub" x="118" y="358">Min SAVC &lt; P &lt; Min SAC</text>
    <text class="text-sub" x="118" y="376">Shutdown only if P &lt; Min SAVC</text>
  </g>
</svg>
