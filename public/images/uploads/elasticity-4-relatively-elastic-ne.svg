<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 418" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">४. सापेक्षिक लोचदार माग</title>
  <desc id="d">Ep &gt; 1  (कम ठाडो / चेप्टो). %ΔQ &gt; %ΔP  (विलासी वस्तु)</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#111827"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans Devanagari', 'Mukta', 'Nirmala UI', 'Mangal', 'Segoe UI', sans-serif; }
    .ttl { font-size: 17px; font-weight: 700; fill: #0f2a3a; text-anchor: middle; }
    .tag { font-size: 13px; font-weight: 600; fill: #0e5a53; text-anchor: middle; }
    .axis { stroke: #111827; stroke-width: 1.8; stroke-linecap: round; }
    .D { fill: none; stroke: #146b63; stroke-width: 3.4; stroke-linecap: round; }
    .gp { stroke: #c2410c; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .gq { stroke: #1d4ed8; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .tp { font-size: 12px; font-weight: 700; fill: #c2410c; text-anchor: end; }
    .tq { font-size: 12px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; }
    .pt { fill: #ffffff; stroke: #146b63; stroke-width: 2.4; }
    .ab { font-size: 12px; font-weight: 700; fill: #374151; text-anchor: middle; }
    .dl { font-size: 15px; font-weight: 700; font-style: italic; fill: #146b63; }
    .axt { font-size: 12.5px; font-weight: 600; fill: #374151; text-anchor: middle; }
    .box { fill: #f6f8f7; stroke: #cfdad6; stroke-width: 1.2; }
    .ln { font-size: 13px; font-weight: 600; fill: #122a3a; }
    .ln3 { font-size: 13.5px; font-weight: 700; fill: #0e4a45; }
    .nt { font-size: 12px; font-weight: 500; fill: #475569; text-anchor: middle; }
    .ex { font-size: 10.5px; font-weight: 500; fill: #64748b; text-anchor: end; }
  </style>

  <rect x="0.75" y="0.75" width="378.5" height="416.5" rx="12" fill="#ffffff" stroke="#cfdad6" stroke-width="1.5"/>

  <text class="ttl" x="190.0" y="29">४. सापेक्षिक लोचदार माग</text>
  <text class="tag" x="190.0" y="49">Ep &gt; 1  (कम ठाडो / चेप्टो)</text>

  <!-- axes -->
  <line class="axis" x1="50" y1="240" x2="50" y2="52" marker-end="url(#ah)"/>
  <line class="axis" x1="50" y1="240" x2="347" y2="240" marker-end="url(#ah)"/>

  <!-- guide lines: orange = price, blue = quantity -->
  <line class="gp" x1="50" y1="127.5" x2="272.0" y2="127.5"/>
  <line class="gq" x1="272.0" y1="127.5" x2="272.0" y2="240"/>
  <line class="gp" x1="50" y1="102.5" x2="198.0" y2="102.5"/>
  <line class="gq" x1="198.0" y1="102.5" x2="198.0" y2="240"/>

  <!-- demand curve -->
  <line class="D" x1="72.2" y1="60.0" x2="307.0" y2="139.3"/>
  <text class="dl" x="315.0" y="143.3" text-anchor="start">D</text>
  <circle class="pt" cx="272.0" cy="127.5" r="4.5"/><circle class="pt" cx="198.0" cy="102.5" r="4.5"/>
  <text class="ab" x="283.0" y="121.5">A</text><text class="ab" x="184.0" y="94.5">B</text>

  <!-- tick labels -->
  <text class="tp" x="42" y="131.5">P</text>
  <text class="tp" x="42" y="106.5">P₁</text>
  <text class="tq" x="272.0" y="257">Q</text>
  <text class="tq" x="198.0" y="257">Q₁</text>

  <!-- axis titles -->
  <text class="axt" x="188" y="277">मात्रा (Q)</text>
  <text class="axt" transform="translate(14 150) rotate(-90)">मूल्य (P)</text>

  <!-- % change box -->
  <rect class="box" x="20" y="296" width="340" height="76" rx="8"/>
  <text class="ln" x="34" y="318">मूल्य: P = ९० → P₁ = ११०,  %ΔP = +२०%</text>
  <text class="ln" x="34" y="338">मात्रा: Q = १२० → Q₁ = ८०,  %ΔQ = −४०%</text>
  <text class="ln3" x="34" y="360">Ep = |%ΔQ ÷ %ΔP| = ४० ÷ २० = २</text>

  <text class="nt" x="190.0" y="389">%ΔQ &gt; %ΔP  (विलासी वस्तु)</text>
  <text class="ex" x="358" y="409">उदाहरण मानहरू, मध्यबिन्दु विधि</text>
</svg>
