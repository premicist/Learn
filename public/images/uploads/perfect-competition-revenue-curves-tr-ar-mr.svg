<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="auto" role="img" aria-label="Revenue Curves under Perfect Competition: TR, AR, and MR">
  <style>
    .bg { fill: #ffffff; stroke: #111111; stroke-width: 1.5; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; }
    .axis { stroke: #1e293b; stroke-width: 2; stroke-linecap: round; }
    .tr-curve { fill: none; stroke: #2563eb; stroke-width: 3.5; stroke-linecap: round; }
    .price-line { fill: none; stroke: #16a34a; stroke-width: 3.5; stroke-linecap: round; }
    .guide-line { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .point-dot { fill: #1e293b; stroke: #ffffff; stroke-width: 2.5; }
    .text-title { font-family: 'Manrope', system-ui, sans-serif; font-size: 15px; font-weight: 800; fill: #0f172a; }
    .text-panel-title { font-family: 'Manrope', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
    .text-label { font-family: 'Manrope', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #1e293b; }
    .text-sub { font-family: 'Manrope', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; }
    .tag-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
  </style>

  <rect class="bg" width="100%" height="100%" rx="10"/>
  <text class="text-title" x="35" y="32">Revenue Curves under Perfect Competition</text>

  <!-- Panel A: Total Revenue (TR) Ray -->
  <g transform="translate(30, 50)">
    <rect class="card" width="365" height="360" rx="8"/>
    <text class="text-panel-title" x="182" y="28">Panel A: Total Revenue (TR)</text>

    <!-- Axes -->
    <line class="axis" x1="50" y1="300" x2="50" y2="55"/>
    <line class="axis" x1="50" y1="300" x2="340" y2="300"/>
    <text class="text-label" x="15" y="60">TR (Rs.)</text>
    <text class="text-label" x="275" y="322">Output (Q)</text>
    <text class="text-label" x="35" y="315">O</text>

    <!-- Linear TR Ray from Origin -->
    <line class="tr-curve" x1="50" y1="300" x2="310" y2="90"/>
    <text class="text-label" x="315" y="90" fill="#2563eb">TR (Slope = P)</text>

    <!-- Data Points along TR -->
    <circle class="point-dot" cx="136" cy="230" r="4" fill="#2563eb"/>
    <line class="guide-line" x1="136" y1="230" x2="136" y2="300"/>
    <line class="guide-line" x1="50" y1="230" x2="136" y2="230"/>
    <text class="text-label" x="22" y="234">10</text>
    <text class="text-label" x="132" y="316">1</text>

    <circle class="point-dot" cx="223" cy="160" r="4" fill="#2563eb"/>
    <line class="guide-line" x1="223" y1="160" x2="223" y2="300"/>
    <line class="guide-line" x1="50" y1="160" x2="223" y2="160"/>
    <text class="text-label" x="22" y="164">20</text>
    <text class="text-label" x="219" y="316">2</text>

    <g transform="translate(60, 80)">
      <rect class="tag-box" width="140" height="42"/>
      <text class="text-sub" x="6" y="16">• Straight line from origin</text>
      <text class="text-sub" x="6" y="32">• Constant slope equal to P</text>
    </g>
  </g>

  <!-- Panel B: AR and MR Curves (Horizontal) -->
  <g transform="translate(425, 50)">
    <rect class="card" width="365" height="360" rx="8"/>
    <text class="text-panel-title" x="182" y="28">Panel B: AR and MR Curves</text>

    <!-- Axes -->
    <line class="axis" x1="50" y1="300" x2="50" y2="55"/>
    <line class="axis" x1="50" y1="300" x2="340" y2="300"/>
    <text class="text-label" x="10" y="60">AR, MR (Rs.)</text>
    <text class="text-label" x="275" y="322">Output (Q)</text>
    <text class="text-label" x="35" y="315">O</text>

    <!-- Horizontal Perfectly Elastic Line at P = 10 (y = 180) -->
    <line class="price-line" x1="50" y1="180" x2="330" y2="180"/>
    <text class="text-label" x="20" y="185">P = 10</text>
    <text class="text-label" x="160" y="165" fill="#16a34a">P = AR = MR (Elasticity = ∞)</text>

    <!-- Points on the horizontal line -->
    <circle class="point-dot" cx="136" cy="180" r="4" fill="#16a34a"/>
    <line class="guide-line" x1="136" y1="180" x2="136" y2="300"/>
    <text class="text-label" x="132" y="316">1</text>

    <circle class="point-dot" cx="223" cy="180" r="4" fill="#16a34a"/>
    <line class="guide-line" x1="223" y1="180" x2="223" y2="300"/>
    <text class="text-label" x="219" y="316">2</text>

    <g transform="translate(60, 80)">
      <rect class="tag-box" width="150" height="42"/>
      <text class="text-sub" x="6" y="16">• Price is constant at all Q</text>
      <text class="text-sub" x="6" y="32">• AR = MR = P (Horizontal ray)</text>
    </g>
  </g>
</svg>