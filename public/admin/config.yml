backend:
  name: git-gateway
  repo: premicist/Learn
  branch: main
  identity_url: https://auth.decapbridge.com/sites/afb8cc14-b7e5-4678-9382-d3136ac237a9
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://prempokhrel.com.np
media_folder: public/images/uploads
public_folder: /images/uploads
collections:
  - name: subjects
    label: Subjects & Levels
    files:
      - file: content/subjects.yml
        label: Subjects & Levels
        name: subjects
        fields:
          - label: Levels
            name: levels
            widget: list
            fields:
              - { label: 'ID (lowercase kebab-case, e.g. bachelors)', name: id, widget: string }
              - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
              - { label: 'Short title (for menus)', name: shortTitle, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Subjects
            name: subjects
            widget: list
            fields:
              - { label: 'ID (lowercase kebab-case, e.g. microeconomics)', name: id, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers, and hyphens only.'] }
              - label: Level
                name: levelId
                widget: relation
                collection: subjects
                file: subjects
                search_fields: [levels.*.id, levels.*.title]
                display_fields: [levels.*.title, levels.*.id]
                value_field: levels.*.id
              - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
              - { label: Description, name: description, widget: text }
              - { label: Color (hex code), name: color, widget: color, allowInput: true }
              - label: Featured resources
                name: featured
                widget: list
                required: false
                summary: '{{type}}: {{id}}'
                hint: 'Add resources in the order they should appear. Use the exact Markdown filename without .md.'
                fields:
                  - { label: Type, name: type, widget: select, options: [note, blog, quiz, video] }
                  - { label: Resource, name: id, widget: resource_id, hint: 'Search by title, subject, or resource ID. Choose the resource matching the selected type.' }

  - name: curricula
    label: Guided Curricula
    files:
      - file: content/curriculum.yml
        label: Guided Curricula
        name: curriculum
        fields:
          - label: Curricula
            name: curricula
            widget: list
            fields:
              - { label: 'ID (lowercase kebab-case)', name: id, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers, and hyphens only.'] }
              - label: Subject
                name: subjectId
                widget: relation
                collection: subjects
                file: subjects
                search_fields: [subjects.*.id, subjects.*.title]
                display_fields: [subjects.*.title, subjects.*.id]
                value_field: subjects.*.id
              - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
              - { label: Description, name: description, widget: text }
              - { label: Syllabus note, name: syllabusNote, widget: string, hint: 'Use simple wording such as Based on the latest NEB syllabus.' }
              - { label: Syllabus chapter titles, name: syllabusChapters, widget: string, required: false, hint: 'Enter chapter titles separated by commas. Leave empty to use the unit titles.' }
              - label: Syllabus chapter links
                name: syllabusChapterLinks
                widget: list
                required: false
                collapsed: true
                fields:
                  - { label: Chapter title, name: title, widget: string }
                  - { label: Optional URL, name: url, widget: string, required: false, hint: 'Leave blank to scroll to the matching unit on this page.' }
                  - { label: Optional unit ID, name: unitId, widget: string, required: false, hint: 'Use this when the chapter title differs from the unit title.' }
              - label: Units
                name: units
                widget: list
                fields:
                  - { label: 'Unit ID', name: id, widget: string }
                  - { label: Order, name: order, widget: number, value_type: int }
                  - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
                  - { label: Summary, name: summary, widget: text }
                  - { label: 'Estimated minutes', name: estimatedMinutes, widget: number, value_type: int }
                  - { label: Outcomes, name: outcomes, widget: list }
                  - label: Lessons
                    name: lessons
                    widget: list
                    fields:
                      - { label: 'Lesson ID', name: id, widget: string }
                      - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
                      - { label: Resource type, name: resourceType, widget: select, options: [note, blog, quiz, video] }
                      - { label: Resource, name: resourceId, widget: resource_id, hint: 'Search for the note, blog, quiz, or video to place in this lesson.' }
                      - { label: 'Estimated minutes', name: estimatedMinutes, widget: number, value_type: int }
                      - { label: Description, name: description, widget: text }

  - name: notes
    label: Notes
    folder: content/notes
    create: true
    summary: '{{title}} · {{subjectId}}'
    slug: '{{slug}}'
    fields:
      - label: Subject
        name: subjectId
        widget: relation
        collection: subjects
        file: subjects
        search_fields: [subjects.*.id, subjects.*.title]
        display_fields: [subjects.*.title, subjects.*.id]
        value_field: subjects.*.id
        hint: 'Search by subject title; the CMS stores the matching subject ID.'
      - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
      - { label: Summary, name: summary, widget: text, hint: 'Write 1–2 sentences describing what a learner will understand or do.' }
      - { label: Date, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { label: Cover Image, name: image, widget: image, required: false }
      - { label: Image alt text, name: imageAlt, widget: string, required: false, hint: 'Describe the image when it conveys meaning; leave blank for decorative images.' }
      - { label: Enable slide viewer, name: slidesEnabled, widget: boolean, required: false, default: false, hint: 'Show a note-derived slide viewer at the top of this note.' }
      - label: Slide controls
        name: slideControls
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Slide mode, name: mode, widget: select, options: [auto, text, bullets, recap], default: auto, hint: 'Use text for paragraph-heavy notes, bullets for compact points, or recap for a summary-focused deck.' }
          - { label: Maximum points per slide, name: maxPoints, widget: number, value_type: int, min: 1, max: 6, default: 4, hint: 'Lower this for dense or numerical notes.' }
          - { label: Include quick check, name: includeQuickCheck, widget: boolean, default: true }
          - { label: Sections to include, name: sections, widget: list, required: false, hint: 'Optional exact H2 section titles. Leave empty to include all sections.' }
          - { label: Deck title, name: title, widget: string, required: false, hint: 'Optional custom title for the slide viewer.' }
      - { label: Legacy visual blocks, name: visualBlocks, widget: hidden, required: false }
      - label: Table of contents headings
        name: toc
        widget: list
        required: false
        hint: 'Optional exact H1/H2 headings to show in note navigation. Leave empty to include all H1/H2 headings.'
      - label: Body
        name: body
        widget: markdown
        editor_components: [image, code-block, learn-formula, learn-table, learn-graph, learn-resource]
        hint: 'Write your note and use the toolbar insert buttons to place formulas, tables, or graphs exactly where they belong.'

  - name: blogs
    label: Blog Posts
    folder: content/blogs
    create: true
    summary: '{{title}} · {{subjectId}}'
    slug: '{{slug}}'
    fields:
      - label: Subject
        name: subjectId
        widget: relation
        collection: subjects
        file: subjects
        search_fields: [subjects.*.id, subjects.*.title]
        display_fields: [subjects.*.title, subjects.*.id]
        value_field: subjects.*.id
        hint: 'Search by subject title; the CMS stores the matching subject ID.'
      - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
      - { label: Date, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Cover Image, name: image, widget: image, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: quizzes
    label: Quizzes
    folder: content/quizzes
    create: true
    summary: '{{title}} · {{subjectId}}'
    slug: '{{slug}}'
    fields:
      - label: Subject
        name: subjectId
        widget: relation
        collection: subjects
        file: subjects
        search_fields: [subjects.*.id, subjects.*.title]
        display_fields: [subjects.*.title, subjects.*.id]
        value_field: subjects.*.id
        hint: 'Search by subject title; the CMS stores the matching subject ID.'
      - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
      - { label: Topic, name: topic, widget: string, required: false, hint: 'The topic card where this quiz set should appear. If blank, the curriculum unit is used.' }
      - { label: Quiz set label, name: setLabel, widget: string, required: false, hint: 'For example Set 1, Numerical practice, or Theory check.' }
      - { label: Question style, name: format, widget: select, options: [theory, numerical, mixed], default: mixed, required: false }
      - label: Questions
        name: questions
        widget: list
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Options, name: options, widget: list }
          - { label: 'Correct option number (0 = first option, 1 = second, etc.)', name: answerIndex, widget: number, value_type: int }
          - { label: Explanation, name: explanation, widget: text }

  - name: practice-sets
    label: Practice Sets
    folder: content/practice-sets
    create: true
    summary: '{{title}} · {{subjectId}}'
    slug: '{{slug}}'
    fields:
      - label: Subject
        name: subjectId
        widget: relation
        collection: subjects
        file: subjects
        search_fields: [subjects.*.id, subjects.*.title]
        display_fields: [subjects.*.title, subjects.*.id]
        value_field: subjects.*.id
        hint: 'Search by subject title; the CMS stores the matching subject ID.'
      - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
      - { label: Instructions, name: instructions, widget: text, required: false, hint: 'Shown above the questions, e.g. "Show your working on paper."' }
      - label: Questions
        name: questions
        widget: list
        fields:
          - label: Type
            name: type
            widget: select
            options: [{ label: 'Numerical (auto-graded)', value: numerical }, { label: 'Writing (graded by you later)', value: writing }]
            default: numerical
          - { label: Question, name: question, widget: text }
          - { label: 'Correct answer (numerical only)', name: answer, widget: number, value_type: float, required: false, hint: 'Leave blank for writing questions.' }
          - { label: 'Tolerance (numerical only)', name: tolerance, widget: number, value_type: float, default: 0, required: false, hint: 'Accepted margin of error either side of the correct answer, e.g. 0.05.' }
          - { label: Points, name: points, widget: number, value_type: int, default: 10 }

  - name: videos
    label: Videos
    folder: content/videos
    create: true
    summary: '{{title}} · {{subjectId}}'
    slug: '{{slug}}'
    fields:
      - label: Subject
        name: subjectId
        widget: relation
        collection: subjects
        file: subjects
        search_fields: [subjects.*.id, subjects.*.title]
        display_fields: [subjects.*.title, subjects.*.id]
        value_field: subjects.*.id
        hint: 'Search by subject title; the CMS stores the matching subject ID.'
      - { label: Title, name: title, widget: string, pattern: ['.{3,}', 'Use a descriptive title of at least 3 characters.'] }
      - { label: Topic, name: topic, widget: string, required: false, hint: 'The topic card where this video should appear. If blank, the curriculum unit is used.' }
      - { label: 'YouTube video ID', name: youtubeId, widget: string, required: false, pattern: ['^[A-Za-z0-9_-]{6,}$', 'Enter only the YouTube video ID, not the full URL.'], hint: 'From youtube.com/watch?v=THIS_PART' }
      - { label: Description, name: description, widget: text }
      - { label: Transcript, name: transcript, widget: text, required: false }
      - label: Key takeaways
        name: keyTakeaways
        widget: list
        required: false
