curricula:
  - id: class-11-economics
    subjectId: class-11
    title: Your guided Economics-I path
    description: Follow a steady sequence from economic foundations to Nepal-focused
      applications and quantitative practice.
    syllabusNote: Based on the latest NEB syllabus.
    syllabusChapters: ""
    syllabusChapterLinks: []
    units:
      - id: foundations
        order: 1
        title: Basic concepts and resources
        summary: Build the vocabulary of economics and see how scarce resources shape
          choices.
        estimatedMinutes: 75
        outcomes:
          - Define economics and explain its scope.
          - Distinguish microeconomics from macroeconomics.
          - Identify land, labour, capital, and organisation as production
            resources.
        lessons:
          - id: class11-foundations
            title: What economics studies
            resourceType: note
            resourceId: class11-economic-basics
            estimatedMinutes: 25
            description: Start with scarcity, choice, opportunity cost, and the basic
              economic problem.
          - id: class11-foundations-check
            title: Check your foundations
            resourceType: quiz
            resourceId: quiz-class11-foundations
            estimatedMinutes: 10
            description: Test the essential terms before moving to markets.
      - id: demand-supply
        order: 2
        title: Demand, supply, and equilibrium
        summary: Explain how buyers and sellers interact and how market equilibrium is
          formed.
        estimatedMinutes: 100
        outcomes:
          - Explain the laws of demand and supply.
          - Distinguish movement along a curve from a shift of a curve.
          - Find equilibrium and interpret simple schedules and diagrams.
        lessons:
          - id: class11-demand-supply
            title: Demand, supply, and the market
            resourceType: note
            resourceId: note-demand-supply
            estimatedMinutes: 25
            description: Learn the core relationships and read a market diagram.
          - id: class11-demand-supply-check
            title: Demand and supply practice
            resourceType: quiz
            resourceId: quiz-demand-supply
            estimatedMinutes: 10
            description: Check whether you can identify equilibrium and curve movements.
      - id: elasticity-consumer
        order: 3
        title: Elasticity and consumer behaviour
        summary: Measure responsiveness and use utility ideas to understand consumer
          choice.
        estimatedMinutes: 120
        outcomes:
          - Calculate and interpret basic price elasticity.
          - Explain total and marginal utility.
          - Apply diminishing marginal utility and consumer surplus.
        lessons:
          - id: class11-elasticity-consumer
            title: Elasticity, utility, and consumer choice
            resourceType: note
            resourceId: class11-elasticity-consumer
            estimatedMinutes: 35
            description: Connect percentage changes in demand with the logic of consumer
              choice.
          - id: class11-elasticity-consumer-check
            title: Elasticity and utility check
            resourceType: quiz
            resourceId: quiz-class11-elasticity
            estimatedMinutes: 12
            description: Practise classification, interpretation, and short calculations.
      - id: production
        order: 4
        title: Production and cost
        summary: Study how firms combine resources, how output changes, and why costs
          matter.
        estimatedMinutes: 110
        outcomes:
          - Define production and production function.
          - Distinguish total, average, and marginal product.
          - Explain the law of variable proportions and basic cost measures.
        lessons:
          - id: class11-production
            title: From inputs to output
            resourceType: note
            resourceId: class11-production-and-cost
            estimatedMinutes: 35
            description: Build a production table and interpret marginal changes.
          - id: class11-production-check
            title: Production and cost practice
            resourceType: quiz
            resourceId: quiz-class11-production
            estimatedMinutes: 12
            description: Check your understanding of product and cost relationships.
      - id: macroeconomics
        order: 5
        title: National income, money, and inflation
        summary: Move from individual markets to economy-wide measures and monetary
          conditions.
        estimatedMinutes: 130
        outcomes:
          - Distinguish major national-income concepts and approaches.
          - Explain the functions of money and broad versus narrow money.
          - Describe inflation, deflation, causes, and effects.
        lessons:
          - id: class11-national-income
            title: Measuring national income
            resourceType: note
            resourceId: class11-national-income
            estimatedMinutes: 35
            description: Organise the key aggregates and avoid common double-counting
              errors.
          - id: class11-money-inflation
            title: Money and inflation
            resourceType: note
            resourceId: class11-money-inflation
            estimatedMinutes: 35
            description: Connect money, prices, and purchasing power through simple
              examples.
      - id: development
        order: 6
        title: Development, growth, and human wellbeing
        summary: Compare growth with broader development and examine poverty,
          inequality, employment, and human resources.
        estimatedMinutes: 95
        outcomes:
          - Distinguish economic growth from economic development.
          - Use development indicators with appropriate care.
          - Explain how poverty, inequality, employment, and human resources
            interact.
        lessons:
          - id: class11-development
            title: Growth, development, and indicators
            resourceType: note
            resourceId: class11-development-growth
            estimatedMinutes: 30
            description: Use a wider lens than output alone when evaluating progress.
          - id: class11-development-application
            title: Nepal-focused development application
            resourceType: blog
            resourceId: blog-class11-development-nepal
            estimatedMinutes: 15
            description: Apply the growth-versus-development distinction to Nepal’s economy.
      - id: nepal-economy
        order: 7
        title: Nepal’s economy and natural resources
        summary: Apply economic ideas to Nepal’s resources, agriculture, industry,
          tourism, transport, and communication.
        estimatedMinutes: 130
        outcomes:
          - Describe major features of Nepal’s economy.
          - Assess natural resources, agriculture, industry, and tourism with
            evidence.
          - Identify local examples and connect them to economic development.
        lessons:
          - id: class11-nepal-economy
            title: A quick overview of Nepal’s economy
            resourceType: blog
            resourceId: blog-nepal-economy-2026
            estimatedMinutes: 20
            description: Establish a country context for the topics that follow.
          - id: class11-nepal-resources
            title: Resources, agriculture, and productive sectors
            resourceType: note
            resourceId: class11-nepal-economy-resources
            estimatedMinutes: 35
            description: Turn local observation into structured economic analysis.
      - id: quantitative-methods
        order: 8
        title: Economic mathematics and problem solving
        summary: Strengthen the mathematical habits needed for schedules, equations, and
          economic numericals.
        estimatedMinutes: 90
        outcomes:
          - Rearrange and solve simple linear equations.
          - Read tables and calculate changes carefully.
          - Show clear steps so that economic reasoning is visible.
        lessons:
          - id: class11-economic-maths
            title: Mathematics for economics
            resourceType: note
            resourceId: class11-economic-maths
            estimatedMinutes: 30
            description: Practise equations, percentage changes, and a repeatable numerical
              method.
          - id: class11-economic-maths-check
            title: Quantitative skills check
            resourceType: quiz
            resourceId: quiz-class11-maths
            estimatedMinutes: 12
            description: Consolidate the calculation patterns used throughout the course.
  - id: class-12-economics
    subjectId: class-12
    title: Your guided Economics-II path
    description: Follow a steady sequence from resource allocation to
      macroeconomics, development, Nepal’s economy, and quantitative techniques.
    syllabusNote: Based on the latest NEB syllabus.
    syllabusChapters: ""
    syllabusChapterLinks: []
    units:
      - id: class12-foundations
        order: 1
        title: Basic concepts and allocation of resources
        summary: Revisit economic choice, compare economic systems, and use the
          production possibility curve.
        estimatedMinutes: 90
        outcomes:
          - Explain the central allocation problems of an economy.
          - Compare market, command, and mixed economic systems.
          - Interpret production possibility curves and opportunity cost.
        lessons:
          - id: class12-foundations-note
            title: Economic systems and the production possibility curve
            resourceType: note
            resourceId: class12-economic-system-ppc
            estimatedMinutes: 35
            description: Compare economic systems and read choice, efficiency, and growth
              from a production possibility curve.
          - id: class12-foundations-check
            title: Allocation and systems check
            resourceType: quiz
            resourceId: quiz-class12-foundations
            estimatedMinutes: 12
            description: Test the core ideas of scarcity, systems, opportunity cost, and
              productive efficiency.
      - id: class12-microeconomics
        order: 2
        title: Microeconomics and market analysis
        summary: Build revenue and cost tables before studying how firms choose price
          and output.
        estimatedMinutes: 190
        outcomes:
          - Calculate and interpret total, average, and marginal revenue.
          - Distinguish fixed, variable, average, and marginal cost.
          - Use revenue and cost relationships to explain firm decisions.
        lessons:
          - id: class12-market-revenue
            title: Market and revenue curves
            resourceType: note
            resourceId: class12-market-revenue
            estimatedMinutes: 35
            description: Connect market demand with total, average, and marginal revenue.
          - id: class12-cost-curves
            title: Cost concepts and cost curves
            resourceType: note
            resourceId: class12-cost-curves
            estimatedMinutes: 35
            description: Build cost tables and explain the relationships among average and
              marginal costs.
          - id: class12-micro-check
            title: Microeconomics practice
            resourceType: quiz
            resourceId: quiz-class12-micro
            estimatedMinutes: 15
            description: Practise revenue and cost calculations before moving to market
              structures.
          - id: "class12-theory-of-interest "
            title: "Theory of Interest "
            resourceType: note
            resourceId: classical-theory-of-interest
            estimatedMinutes: 15
            description: "Understanding the theory of Interest "
      - id: class12-price-output
        order: 3
        title: Price and output determination
        summary: Compare perfect and imperfect competition using equilibrium, profit,
          and market-power reasoning.
        estimatedMinutes: 170
        outcomes:
          - Explain the assumptions of perfect competition.
          - Determine firm output using the marginal-revenue and marginal-cost
            condition.
          - Compare competitive and monopoly outcomes.
        lessons:
          - id: class12-perfect-competition
            title: Price and output under perfect competition
            resourceType: note
            resourceId: class12-perfect-competition
            estimatedMinutes: 35
            description: Use price, marginal revenue, marginal cost, and shutdown reasoning
              to explain firm equilibrium.
          - id: class12-imperfect-competition
            title: Price and output under imperfect competition
            resourceType: note
            resourceId: class12-imperfect-competition
            estimatedMinutes: 35
            description: Compare monopoly and other imperfectly competitive markets through
              demand and revenue curves.
          - id: class12-price-output-check
            title: Price and output practice
            resourceType: quiz
            resourceId: quiz-class12-price-output
            estimatedMinutes: 15
            description: Check equilibrium conditions, diagrams, and market-structure
              comparisons.
      - id: class12-factor-pricing
        order: 4
        title: Factor pricing and distribution
        summary: Study how land, labour, capital, and entrepreneurship are rewarded in
          the distribution of income.
        estimatedMinutes: 150
        outcomes:
          - Explain the meaning of factor pricing and distribution.
          - Distinguish rent, wages, interest, and profit.
          - Explain and evaluate classical wage theories in simple economic
            situations.
        lessons:
          - id: class12-factor-pricing-note
            title: Factor pricing and the Ricardian theory of rent
            resourceType: note
            resourceId: factor-pricing-rent-concept
            estimatedMinutes: 40
            description: Review rent and the Ricardian theory, then connect them to wages,
              interest, and profit.
          - id: class12-factor-pricing-extension
            title: Factor rewards and distribution
            resourceType: note
            resourceId: class12-factor-pricing
            estimatedMinutes: 30
            description: Organise the main factor rewards and the forces that influence
              their differences.
          - id: class12-subsistence-wage
            title: Subsistence theory of wage
            resourceType: note
            resourceId: class12-subsistence-theory-wage
            estimatedMinutes: 30
            description: Explain the classical wage-adjustment mechanism and evaluate its
              assumptions and criticisms.
          - id: class12-wage-fund-theory
            title: Wage Fund Theory of Wages
            resourceType: note
            resourceId: class12-wage-fund-theory
            estimatedMinutes: 30
            description: Use the wage-fund formula to explain average wages and evaluate the
              theory’s assumptions and criticisms.
          - id: class12-factor-pricing-check
            title: Factor pricing practice
            resourceType: quiz
            resourceId: quiz-class12-factor-pricing
            estimatedMinutes: 15
            description: Practise rent, wages, interest, profit, and distribution reasoning.
      - id: class12-macro-policy
        order: 5
        title: Banking, public finance, and international trade
        summary: Move to macroeconomic institutions and examine money, fiscal choices,
          and global exchange.
        estimatedMinutes: 215
        outcomes:
          - Explain the functions of banks and the main tools of monetary policy.
          - Classify public revenue, expenditure, budgets, and fiscal policy.
          - Use comparative advantage to evaluate international trade and policy.
        lessons:
          - id: class12-banking
            title: Banking and monetary policy
            resourceType: note
            resourceId: class12-banking-monetary-policy
            estimatedMinutes: 35
            description: Understand money creation, central banking, and monetary-policy
              transmission.
          - id: class12-government-finance
            title: Government finance and fiscal policy
            resourceType: note
            resourceId: class12-government-finance
            estimatedMinutes: 35
            description: Organise public revenue and expenditure and explain fiscal policy
              choices.
          - id: class12-international-trade
            title: International trade and trade policy
            resourceType: note
            resourceId: class12-international-trade
            estimatedMinutes: 35
            description: Apply comparative advantage and evaluate tariffs, quotas, and
              exchange-rate links.
          - id: class12-macro-check
            title: Macro policy practice
            resourceType: quiz
            resourceId: quiz-class12-macro
            estimatedMinutes: 15
            description: Consolidate banking, fiscal policy, and international-trade
              reasoning.
      - id: class12-development-nepal
        order: 6
        title: Development, Nepal’s economy, and quantitative techniques
        summary: Apply development ideas to Nepal and finish with data skills for
          economic interpretation.
        estimatedMinutes: 250
        outcomes:
          - Evaluate poverty, inequality, unemployment, and human resources
            together.
          - Explain Nepal’s trade, employment, planning, and
            sustainable-development priorities.
          - Calculate and interpret basic dispersion and index-number measures.
        lessons:
          - id: class12-development
            title: Development economics
            resourceType: note
            resourceId: class12-development-economics
            estimatedMinutes: 35
            description: Distinguish growth from development and evaluate wellbeing and
              employment.
          - id: class12-nepal-trade
            title: Nepal’s foreign trade and foreign employment
            resourceType: note
            resourceId: class12-nepal-trade-employment
            estimatedMinutes: 35
            description: Connect trade, migration, remittances, and employment challenges in
              Nepal.
          - id: class12-nepal-planning
            title: Development planning in Nepal
            resourceType: note
            resourceId: class12-nepal-development-planning
            estimatedMinutes: 30
            description: Understand planning goals, resource allocation, implementation, and
              evaluation.
          - id: class12-nepal-sdgs
            title: Sustainable Development Goals and Nepal
            resourceType: note
            resourceId: class12-sdgs-nepal
            estimatedMinutes: 30
            description: Connect economic, social, and environmental dimensions of
              sustainable development.
          - id: class12-quantitative
            title: Quantitative techniques for economics
            resourceType: note
            resourceId: class12-quantitative-techniques
            estimatedMinutes: 35
            description: Practise dispersion, index numbers, and clear interpretation of
              economic data.
          - id: class12-development-check
            title: Development and quantitative skills check
            resourceType: quiz
            resourceId: quiz-class12-development-quantitative
            estimatedMinutes: 15
            description: Review development indicators, Nepal-focused applications, and
              quantitative reasoning.
  - id: sociology-guided
    subjectId: sociology
    title: Your guided Sociology path
    description: Follow a structured sequence through sociological concepts,
      institutions, change, culture, demography, and urbanisation.
    syllabusNote: A structured Sociology study path.
    syllabusChapters: ""
    syllabusChapterLinks: []
    units:
      - id: sociology-overview
        order: 1
        title: Overview of Sociology
        summary: Build a clear foundation in sociological thinking, social interaction,
          and the relevance of sociology to organisations and everyday life.
        estimatedMinutes: 95
        outcomes:
          - Explain the meaning, nature, subject matter, and scope of sociology.
          - Describe the origin and development of sociology, including its
            development in Nepal.
          - Classify major forms of social interaction and connect sociology
            with business and management.
        lessons:
          - id: sociology-overview-note
            title: What Sociology studies
            resourceType: note
            resourceId: sociology-overview
            estimatedMinutes: 35
            description: Learn the scope of sociology, its development, social interaction,
              and its practical relevance.
          - id: sociology-overview-check
            title: Sociology foundations check
            resourceType: quiz
            resourceId: quiz-sociology-overview
            estimatedMinutes: 12
            description: Test the basic vocabulary and applications of sociological
              thinking.
      - id: sociology-theories
        order: 2
        title: Theoretical Perspectives of Sociology
        summary: Compare major sociological perspectives and use them as different
          lenses for interpreting organisations and social life.
        estimatedMinutes: 100
        outcomes:
          - Explain structural functionalism, conflict theory, symbolic
            interactionism, and postmodernism.
          - Compare the assumptions and criticisms of major sociological
            perspectives.
          - Apply theory to simple business, workplace, and social situations.
        lessons:
          - id: sociology-theories-note
            title: Four sociological perspectives
            resourceType: note
            resourceId: sociology-theoretical-perspectives
            estimatedMinutes: 40
            description: Compare functionalist, conflict, interactionist, and postmodern
              approaches.
          - id: sociology-theories-check
            title: Sociological theory practice
            resourceType: quiz
            resourceId: quiz-sociology-theories
            estimatedMinutes: 12
            description: Identify theoretical lenses, assumptions, and practical
              applications.
      - id: sociology-society
        order: 3
        title: The Foundations of Society
        summary: Organise the building blocks of society, from community and culture to
          socialisation, institutions, norms, values, status, and roles.
        estimatedMinutes: 150
        outcomes:
          - Distinguish society, community, culture, and social institutions.
          - Explain socialisation and the roles of family, education, religion,
            economy, and politics.
          - Analyse how norms, values, status, and roles shape social behaviour.
        lessons:
          - id: sociology-society-note
            title: Society, culture, and social institutions
            resourceType: note
            resourceId: sociology-foundations-of-society
            estimatedMinutes: 50
            description: Study society, community, culture, socialisation, institutions,
              norms, values, status, and roles.
          - id: sociology-social-institutions
            title: Social institutions in everyday life
            resourceType: note
            resourceId: note-social-institutions
            estimatedMinutes: 20
            description: Review how family, education, religion, and the state organise
              important social needs.
          - id: sociology-society-check
            title: Society and culture practice
            resourceType: quiz
            resourceId: quiz-sociology-society
            estimatedMinutes: 15
            description: Practise distinctions among social concepts and institutions.
      - id: sociology-change
        order: 4
        title: Social Change and Social Movement
        summary: Examine why societies change and how movements, technology, media, and
          global connections affect work and markets.
        estimatedMinutes: 90
        outcomes:
          - Explain the meaning and nature of social change.
          - Describe modernisation, diffusion, social media, technology, and
            globalisation as drivers of change.
          - Classify social movements and evaluate their effects on workers and
            markets.
        lessons:
          - id: sociology-change-note
            title: How societies change
            resourceType: note
            resourceId: sociology-social-change-movements
            estimatedMinutes: 35
            description: Connect social change, social movements, technology, and
              globalisation to working life.
          - id: sociology-change-check
            title: Social change practice
            resourceType: quiz
            resourceId: quiz-sociology-change
            estimatedMinutes: 12
            description: Check the causes, types, and impacts of social change and
              movements.
      - id: sociology-culture-business
        order: 5
        title: Business and Culture
        summary: Understand how organisations adapt to cultural transformation and how
          cultural differences influence marketing, human resources, and
          negotiation.
        estimatedMinutes: 95
        outcomes:
          - Explain how business adapts to social and cultural transformation.
          - Distinguish acculturation, enculturation, assimilation, and
            adaptation.
          - Apply cultural dimensions to marketing, human resources, and
            negotiations.
        lessons:
          - id: sociology-culture-business-note
            title: Culture in organisations and markets
            resourceType: note
            resourceId: sociology-business-and-culture
            estimatedMinutes: 35
            description: Explore cultural processes and their implications for
              organisations, customers, and workplaces.
          - id: sociology-culture-business-check
            title: Business and culture practice
            resourceType: quiz
            resourceId: quiz-sociology-culture-business
            estimatedMinutes: 12
            description: Practise cultural concepts and workplace applications.
      - id: sociology-demography
        order: 6
        title: Business Demography
        summary: Use population concepts and demographic evidence to understand
          workforce planning, markets, inequality, and business opportunity.
        estimatedMinutes: 155
        outcomes:
          - Explain demography, population distribution, density, and
            composition.
          - Distinguish census, surveys, and vital statistics as tools of
            demographic analysis.
          - Evaluate population as a resource, demographic dividend, migration,
            ageing, and youth unemployment.
        lessons:
          - id: sociology-demography-note
            title: Population, people, and business
            resourceType: note
            resourceId: sociology-business-demography
            estimatedMinutes: 50
            description: Study population structure, demographic tools, human resources,
              inequality, and business planning.
          - id: sociology-demography-check
            title: Demography practice
            resourceType: quiz
            resourceId: quiz-sociology-demography
            estimatedMinutes: 15
            description: Check population measures and the implications of demographic
              change.
      - id: sociology-urbanization
        order: 7
        title: Urbanization
        summary: Examine urbanisation as a demographic, structural, and behavioural
          process and identify its effects on infrastructure, labour, markets,
          and enterprise.
        estimatedMinutes: 90
        outcomes:
          - Explain the meaning and causes of urbanisation.
          - Distinguish behavioural, structural, and demographic views of
            urbanisation.
          - Evaluate opportunities and challenges created by urban growth.
        lessons:
          - id: sociology-urbanization-note
            title: Urbanisation and changing markets
            resourceType: note
            resourceId: sociology-urbanization
            estimatedMinutes: 35
            description: Connect urban growth with infrastructure, labour, markets, and
              business opportunities.
          - id: sociology-urbanization-check
            title: Urbanisation practice
            resourceType: quiz
            resourceId: quiz-sociology-urbanization
            estimatedMinutes: 12
            description: Review the meanings, drivers, impacts, and opportunities of
              urbanisation.
  - id: microeconomics-guided
    subjectId: microeconomics
    title: Your guided Microeconomics path
    description: Follow a structured sequence through choice, markets, consumer
      behaviour, firms, pricing, and resource allocation.
    syllabusNote: A structured Microeconomics study path.
    syllabusChapters: ""
    syllabusChapterLinks: []
    units:
      - id: micro-foundations
        order: 1
        title: Introduction to Microeconomics
        summary: Build the language of scarcity, choice, economic reasoning, and
          business decision-making.
        estimatedMinutes: 120
        outcomes:
          - Explain the meaning, scope, and uses of microeconomics.
          - Distinguish positive and normative economic statements.
          - Apply scarcity, opportunity cost, incentives, and marginal reasoning.
        lessons:
          - id: micro-introduction
            title: "Microeconomics: scope and method"
            resourceType: note
            resourceId: micro-introduction
            estimatedMinutes: 25
            description: Understand what microeconomics studies and how it supports resource
              allocation and business decisions.
          - id: micro-positive-normative
            title: Positive, normative, micro, and macro economics
            resourceType: note
            resourceId: micro-positive-normative
            estimatedMinutes: 25
            description: Separate evidence, explanation, evaluation, and recommendation in
              economic reasoning.
          - id: micro-scarcity-choice
            title: Scarcity, alternatives, and choice
            resourceType: note
            resourceId: micro-scarcity-choice
            estimatedMinutes: 25
            description: Use scarcity, opportunity cost, incentives, and efficiency to
              explain decisions.
          - id: micro-foundations-check
            title: Microeconomics foundations practice
            resourceType: quiz
            resourceId: quiz-micro-foundations
            estimatedMinutes: 12
            description: Check the core concepts before moving to demand and supply.
      - id: micro-demand-supply
        order: 2
        title: Demand, Supply, Equilibrium, and Elasticity
        summary: Move from demand and supply functions to equilibrium, government
          policy, efficiency, and elasticity applications.
        estimatedMinutes: 220
        outcomes:
          - Explain demand and supply functions and distinguish shifts from
            movements.
          - Determine market equilibrium and evaluate taxes, subsidies, and
            price controls.
          - Calculate and interpret price, income, cross, advertising, and
            supply elasticities.
        lessons:
          - id: micro-demand-function
            title: Demand function and the law of demand
            resourceType: note
            resourceId: micro-demand-function
            estimatedMinutes: 30
            description: Define demand and relate quantity demanded to price, income,
              tastes, and related goods.
          - id: micro-supply-function
            title: Supply function and the law of supply
            resourceType: note
            resourceId: micro-supply-function
            estimatedMinutes: 30
            description: Explain supply and the producer-side conditions that shape it.
          - id: micro-equilibrium-policy
            title: Market equilibrium and government policy
            resourceType: note
            resourceId: micro-equilibrium-policy
            estimatedMinutes: 35
            description: Find equilibrium and examine taxes, subsidies, price controls, and
              efficiency.
          - id: micro-price-elasticity
            title: Price elasticity of demand
            resourceType: note
            resourceId: note-elasticity
            estimatedMinutes: 30
            description: Measure responsiveness to price and connect elasticity with revenue
              and decisions.
          - id: micro-elasticity-applications
            title: Other elasticities and business applications
            resourceType: note
            resourceId: micro-elasticity-applications
            estimatedMinutes: 30
            description: Extend elasticity analysis to income, cross, advertising, and
              supply responses.
          - id: micro-demand-supply-check
            title: Demand, supply, and elasticity practice
            resourceType: quiz
            resourceId: quiz-micro-demand-supply
            estimatedMinutes: 15
            description: Practise curve shifts, policy effects, and elasticity
              interpretation.
          - id: micro-elasticity-check
            title: Price elasticity check
            resourceType: quiz
            resourceId: quiz-elasticity
            estimatedMinutes: 10
            description: Reinforce the measurement and classification of price elasticity.
      - id: micro-consumer-cardinal
        order: 3
        title: "Consumer Behaviour I: Utility and Risk"
